<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1014">
<title>المساعد الدراسي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e1014;--panel:#15181e;--line:#232832;--fg:#e8eaee;--mute:#8b93a1;--user:#1b2030;--acc:#8b9bff;--accfg:#0e1014;--r:14px}
@media (prefers-color-scheme:light){:root{--bg:#fafaf9;--panel:#fff;--line:#e6e6e3;--fg:#17181b;--mute:#6b7280;--user:#eef0f6;--acc:#3b4cca;--accfg:#fff}}
*{box-sizing:border-box;margin:0}
html{color-scheme:dark light}
html,body{height:100%;overflow-x:hidden}
main{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
main::-webkit-scrollbar{width:8px}main::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
body{background:var(--bg);color:var(--fg);font:16px/1.7 "IBM Plex Sans Arabic",system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;flex-direction:column;height:100dvh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
header{border-bottom:1px solid var(--line);background:var(--bg)}
.top{max-width:780px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-weight:600;font-size:15px;white-space:nowrap}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;margin-inline-start:auto}
.tab{padding:5px 14px;border-radius:7px;font-size:14px;color:var(--mute);transition:.15s}
.tab[aria-selected=true]{background:var(--acc);color:var(--accfg);font-weight:500}
.new{color:var(--mute);font-size:13px;padding:6px 8px;border-radius:8px}
.new:hover{background:var(--panel);color:var(--fg)}
main{flex:1;overflow-y:auto;scroll-behavior:smooth}
.col{max-width:780px;margin:0 auto;padding:24px 16px 8px}
.empty{min-height:55vh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:6px}
.empty h1{font-size:26px;font-weight:600}
.empty p{color:var(--mute);font-size:15px;max-width:440px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:18px}
.chip{border:1px solid var(--line);background:var(--panel);padding:8px 14px;border-radius:999px;font-size:14px;transition:.15s}
.chip:hover{border-color:var(--acc)}
.msg{margin:0 0 22px}
.msg.user{display:flex;justify-content:flex-start}
.msg.user .t{background:var(--user);padding:10px 16px;border-radius:var(--r);max-width:85%;white-space:pre-wrap}
.msg.bot .row{display:flex;gap:12px}
.av{flex:none;width:28px;height:28px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;margin-top:2px}
.av svg{width:16px;height:16px}
.bot .t{flex:1;min-width:0;overflow-wrap:anywhere}
.t p{margin:0 0 .7em}.t p:last-child{margin:0}
.t ul,.t ol{margin:0 0 .7em;padding-inline-start:1.4em}
.t li{margin:.15em 0}
.t strong{font-weight:600}
.t blockquote{border-inline-start:3px solid var(--line);padding-inline-start:12px;color:var(--mute);margin:0 0 .7em}
.acts{margin-top:6px;display:flex;gap:4px}
.sugs{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 18px;padding-inline-start:40px}.sugs .chip{font-size:13px;padding:6px 12px}
.acts button{font-size:12.5px;color:var(--mute);padding:3px 8px;border-radius:7px}
.acts button:hover{background:var(--panel);color:var(--fg)}
.dots{display:inline-flex;gap:5px;padding:10px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:b 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes b{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}
@media (max-width:560px){.top{flex-wrap:wrap;padding:8px 12px}.new{margin-inline-start:auto}.tabs{order:3;width:100%;margin:0}.tab{flex:1;text-align:center;padding:6px 2px;font-size:13px;white-space:nowrap}.empty h1{font-size:22px}.col{padding:18px 12px 8px}.msg.user .t{max-width:92%}}
@media (prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}main{scroll-behavior:auto}}
footer{padding:8px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,var(--bg) 30%)}
.box{max-width:780px;margin:0 auto}
form{display:flex;align-items:flex-end;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:8px 8px 8px 12px;transition:border-color .15s}
form:focus-within{border-color:var(--acc)}
textarea{flex:1;resize:none;border:0;outline:0;background:none;color:var(--fg);font:inherit;line-height:1.6;max-height:160px;padding:6px 8px}
textarea::placeholder{color:var(--mute)}
#send{flex:none;width:40px;height:40px;border-radius:50%;background:var(--acc);color:var(--accfg);display:grid;place-items:center;transition:opacity .15s}
#send:disabled{opacity:.35;cursor:default}
#send svg{width:18px;height:18px;transform:scaleX(-1)}
.note{text-align:center;color:var(--mute);font-size:12px;margin-top:8px}
.modes{display:flex;gap:8px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}.modes::-webkit-scrollbar{display:none}.modes .chip{white-space:nowrap;font-size:13px;padding:5px 12px}
.wait{color:var(--mute);font-size:13px;min-height:1.2em}
.qbtn{border:1px solid var(--acc);color:var(--acc);padding:5px 12px;border-radius:8px;font-size:13px;font-weight:500;white-space:nowrap}
.qbtn:hover{background:var(--acc);color:var(--accfg)}
#quiz{position:fixed;inset:0;background:var(--bg);z-index:10;overflow-y:auto}#quiz[hidden]{display:none}
.qwrap{max-width:680px;margin:0 auto;padding:12px 16px 48px}
.qtop{display:flex;align-items:center;justify-content:space-between;padding:6px 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px}#qsub{font-weight:600;font-size:15px}
.qh{font-size:22px;font-weight:600;margin:6px 0}
.qmute{color:var(--mute);font-size:13.5px;margin:4px 0}
.qlab{margin:18px 0 8px;font-size:14px;color:var(--mute)}
.qchips{display:flex;flex-wrap:wrap;gap:8px}
.chip.on{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.qgo{background:var(--acc);color:var(--accfg);padding:10px 22px;border-radius:12px;font-weight:500;margin-top:20px}
.qbar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px}.qbar i{display:block;height:100%;background:var(--acc);transition:width .3s}
.qmeta{font-size:12.5px;color:var(--mute);margin-bottom:10px}
.qq{font-size:18px;line-height:1.8;margin-bottom:16px;white-space:pre-wrap;font-weight:500}
.qbox{display:flex;flex-direction:column;gap:10px}
.opt{display:block;width:100%;text-align:start;padding:12px 14px;border:1px solid var(--line);background:var(--panel);border-radius:12px;font-size:16px;transition:.15s}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.ok{border-color:#3fb27f;background:rgba(63,178,127,.16)}
.opt.bad{border-color:#e5645f;background:rgba(229,100,95,.16)}
.opt:disabled{cursor:default;color:inherit}
.qans{width:100%;resize:vertical;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:12px;padding:10px 12px;font:inherit}
.qmodel{margin-top:6px;padding:12px 14px;border-radius:12px;background:var(--panel);border:1px solid var(--line);white-space:pre-wrap}
.qfb{margin-top:16px;padding:12px 14px;border-radius:12px;border:1px solid var(--line)}
.qfb.ok{border-color:#3fb27f}.qfb.bad{border-color:#e5645f}
.qrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}.qrow .qgo{margin-top:0}
.qmiss{border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:8px;background:var(--panel)}.qmiss summary{cursor:pointer}
@media (max-width:560px){.qbtn{margin-inline-start:auto}.new{margin-inline-start:0}}
</style>
</head>
<body>
<header><div class="top">
<span class="brand">المساعد الدراسي</span>
<div class="tabs" role="tablist" id="tabs"></div>
<button class="qbtn" id="qz">اختبرني</button><button class="new" id="new" title="محادثة جديدة">محادثة جديدة</button>
</div></header>
<main id="main"><div class="col" id="col"></div></main>
<footer><div class="box">
<div class="modes" id="modes"></div><form id="f"><textarea id="q" rows="1" maxlength="500" placeholder="اكتب سؤالك من الكتاب..."></textarea>
<button id="send" type="submit" aria-label="إرسال" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>
<div class="note">الإجابات مأخوذة من كتب المنهج. راجع كتابك للتأكد.</div>
</div></footer>
<div id="quiz" hidden><div class="qwrap"><div class="qtop"><button class="new" id="qx">رجوع للمحادثة</button><span id="qsub"></span></div><div id="qbody"></div></div></div>
<script>
var BROKER='https://hala-chat-jh6w.onrender.com';
var SUBJ={science:{n:'العلوم',s:['اشرح لي درس الجهاز التنفسي','أعطني أسئلة متوقعة عن الجهاز التنفسي','ما وظيفة القصبة الهوائية؟']},social:{n:'الاجتماعيات',s:['اشرح لي مفهوم الحضارة الإسلامية','ما تعريف الثقافة؟','أعطني أسئلة متوقعة عن أسس قيام الحضارة الإسلامية']},islamic:{n:'التربية الإسلامية',s:['اشرح لي حادثة الإسراء والمعراج','ما فوائد صلاة الجمعة؟','أعطني أسئلة متوقعة عن فضل يوم الجمعة']}};
var cur='science',busy=false,H={science:[],social:[],islamic:[]};
try{var sv=JSON.parse(localStorage.getItem('study_h')||'null');if(sv)for(var k in H)if(sv[k])H[k]=sv[k]}catch(e){}
function save(){try{localStorage.setItem('study_h',JSON.stringify(H))}catch(e){}}
var $=function(i){return document.getElementById(i)};
var BOT='<div class="av"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/></svg></div>';
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function inl(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')}
function md(t){var out='',lines=t.split('\n'),list=null,para=[];
function fp(){if(para.length){out+='<p>'+para.join('<br>')+'</p>';para=[]}}
function fl(){if(list){out+='</'+list+'>';list=null}}
lines.forEach(function(l){var m;
if(m=l.match(/^\s*[-*•]\s+(.*)/)){fp();if(list!=='ul'){fl();out+='<ul>';list='ul'}out+='<li>'+inl(m[1])+'</li>'}
else if(m=l.match(/^\s*\d+[.)]\s+(.*)/)){fp();if(list!=='ol'){fl();out+='<ol>';list='ol'}out+='<li>'+inl(m[1])+'</li>'}
else if(m=l.match(/^\s*>\s?(.*)/)){fp();fl();out+='<blockquote>'+inl(m[1])+'</blockquote>'}
else if(!l.trim()){fp();fl()}
else{fl();para.push(inl(l.replace(/^#+\s*/,'')))}});
fp();fl();return out}
function tabs(){$('tabs').innerHTML='';Object.keys(SUBJ).forEach(function(k){var b=document.createElement('button');b.className='tab';b.textContent=SUBJ[k].n;b.setAttribute('role','tab');b.setAttribute('aria-selected',k===cur);b.onclick=function(){if(busy||k===cur)return;cur=k;tabs();draw()};$('tabs').appendChild(b)})}
function draw(){var c=$('col'),h=H[cur];c.innerHTML='';
if(!h.length){var e=document.createElement('div');e.className='empty';e.innerHTML='<h1>اسأل عن '+SUBJ[cur].n+'</h1><p>أجيب من نص الكتاب فقط. اكتب سؤالك أو جرّب أحد الأسئلة.</p>';var ch=document.createElement('div');ch.className='chips';SUBJ[cur].s.forEach(function(s){var b=document.createElement('button');b.className='chip';b.textContent=s;b.onclick=function(){ask(s)};ch.appendChild(b)});e.appendChild(ch);c.appendChild(e)}
h.forEach(function(m){c.appendChild(node(m))});var lm=h[h.length-1];if(lm&&lm.r==='b'&&!busy){var sg=document.createElement('div');sg.className='sugs';(lm.s||[]).concat(['اشرح لي أكثر','أعطني أسئلة عن هذا الموضوع']).forEach(function(s){var b=document.createElement('button');b.className='chip';b.textContent=s;b.onclick=function(){ask(s)};sg.appendChild(b)});c.appendChild(sg)}scroll()}
function node(m){var d=document.createElement('div');
if(m.r==='u'){d.className='msg user';d.innerHTML='<div class="t"></div>';d.firstChild.textContent=m.t}
else{d.className='msg bot';d.innerHTML='<div class="row">'+BOT+'<div><div class="t">'+md(m.t)+'</div><div class="acts"><button>نسخ</button></div></div></div>';d.querySelector('.acts button').onclick=function(){var b=this;try{navigator.clipboard.writeText(m.t);b.textContent='تم النسخ';setTimeout(function(){b.textContent='نسخ'},1500)}catch(e){}}}
return d}
function scroll(){var m=$('main');m.scrollTop=m.scrollHeight}
var W1,W2;function typing(){var d=document.createElement('div');d.className='msg bot';d.id='typing';d.innerHTML='<div class="row">'+BOT+'<div><div class="dots"><i></i><i></i><i></i></div><div class="wait" id="wt"></div></div></div>';$('col').appendChild(d);scroll();clearTimeout(W1);clearTimeout(W2);W1=setTimeout(function(){var w=$('wt');if(w)w.textContent='أبحث في الكتاب...'},6000);W2=setTimeout(function(){var w=$('wt');if(w)w.textContent='الطلبات كثيرة شوي، لحظات وأرد عليك...'},16000)}
function lock(b){busy=b;$('q').disabled=b;upd()}
function upd(){$('send').disabled=busy||!$('q').value.trim()}
async function ask(q){q=(q||'').trim();if(!q||busy)return;var s=cur;var hist=H[s].slice(-4).map(function(m){return{r:m.r,t:m.t.slice(0,700)}});H[s].push({r:'u',t:q});save();$('q').value='';grow();draw();lock(true);typing();var rep,sug=[];
try{var ac=new AbortController();var to=setTimeout(function(){ac.abort()},75000);var r=await fetch(BROKER+'/study/ask',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:s,question:q,history:hist}),signal:ac.signal});clearTimeout(to);var j=await r.json();sug=j.suggestions||[];rep=j.reply||j.error||(r.status===429?'الطلبات كثيرة الحين، انتظر دقيقة وجرّب مرة ثانية.':'صار خطأ، جرّب مرة ثانية.')}catch(e){rep=(e&&e.name==='AbortError')?'الرد تأخر أكثر من اللازم، جرّب مرة ثانية.':'تعذّر الاتصال بالسيرفر. جرّب بعد شوي.'}clearTimeout(W1);clearTimeout(W2);
H[s].push({r:'b',t:rep,s:sug});save();lock(false);if(s===cur)draw();$('q').focus()}
function grow(){var t=$('q');t.style.height='auto';t.style.height=Math.min(t.scrollHeight,160)+'px';upd()}
$('q').addEventListener('input',grow);
$('q').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();ask(this.value)}});
$('f').onsubmit=function(e){e.preventDefault();ask($('q').value)};
$('new').onclick=function(){if(busy)return;H[cur]=[];save();draw()};
var QZ={items:[],run:[],i:0,score:0,miss:[],kind:'all',n:10,subj:null,done:false};
var QK={all:'الكل',mcq:'اختيار من متعدد',tf:'صح أو خطأ',open:'أسئلة مفتوحة'};
function hh(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function qn(s){var x=String(s||'');x=x.replace(new RegExp('[\u064B-\u065F\u0640]','g'),'');x=x.replace(new RegExp('[\u0623\u0625\u0622]','g'),'\u0627');x=x.replace(new RegExp('\u0649','g'),'\u064A').replace(new RegExp('\u0629','g'),'\u0647');return x.replace(/\s+/g,' ').trim()}
function qkind(it){if(it.t==='mcq'&&it.o&&qopt(it)>=0)return'mcq';if(it.t==='tf')return'tf';return'open'}
function qopt(it){var a=qn(it.a),o=it.o||[],k;for(k=0;k<o.length;k++)if(qn(o[k])===a)return k;for(k=0;k<o.length;k++){var x=qn(o[k]);if(x&&(a.indexOf(x)===0||x.indexOf(a)===0))return k}return-1}
function qshuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
async function qload(s){var items=null;try{items=JSON.parse(localStorage.getItem('quiz_'+s)||'null')}catch(e){}
try{var r=await fetch(BROKER+'/quiz?subject='+s);if(r.ok){var j=await r.json();if(j&&j.length){items=j;try{localStorage.setItem('quiz_'+s,JSON.stringify(j))}catch(e){}}}}catch(e){}
return items||[]}
function qopen(){document.getElementById('quiz').hidden=false;document.body.style.overflow='hidden';QZ.subj=cur;document.getElementById('qsub').textContent='اختبار '+SUBJ[cur].n;var b=document.getElementById('qbody');b.innerHTML='';b.appendChild(hh('p','qmute','جاري تحميل الأسئلة... (أول مرة ممكن ياخذ ثواني)'));qload(cur).then(function(it){QZ.items=it;qstart()})}
function qclose(){document.getElementById('quiz').hidden=true;document.body.style.overflow=''}
function qcount(k){return QZ.items.filter(function(x){return k==='all'||qkind(x)===k}).length}
function qstart(){var b=document.getElementById('qbody');b.innerHTML='';
if(!QZ.items.length){b.appendChild(hh('p','qmute','ما فيه أسئلة لهالمادة لين الحين.'));return}
b.appendChild(hh('h2','qh','جاهز تختبر نفسك؟'));
b.appendChild(hh('p','qmute',QZ.items.length+' سؤال من بنوك الأسئلة وامتحانات المناطق، وكل جواب مأخوذ من الكتاب.'));
b.appendChild(hh('div','qlab','نوع الأسئلة'));var r1=hh('div','qchips');['all','mcq','tf','open'].forEach(function(k){var c=qcount(k);if(!c)return;var e=hh('button','chip'+(QZ.kind===k?' on':''),QK[k]+' ('+c+')');e.onclick=function(){QZ.kind=k;qstart()};r1.appendChild(e)});b.appendChild(r1);
b.appendChild(hh('div','qlab','عدد الأسئلة'));var r2=hh('div','qchips');[10,20,40].forEach(function(n){var e=hh('button','chip'+(QZ.n===n?' on':''),String(n));e.onclick=function(){QZ.n=n;qstart()};r2.appendChild(e)});b.appendChild(r2);
var go=hh('button','qgo','ابدأ الاختبار');go.onclick=function(){var pool=QZ.items.filter(function(x){return QZ.kind==='all'||qkind(x)===QZ.kind});QZ.run=qshuf(pool).slice(0,QZ.n);QZ.i=0;QZ.score=0;QZ.miss=[];qq()};b.appendChild(go)}
function qfb(box,ok,it,extra){var f=hh('div','qfb '+(ok?'ok':'bad'));f.appendChild(hh('b',null,ok?'صح ✓':'غلط ✗'));if(!ok||extra){var t=hh('div',null,'الجواب الصحيح: '+it.a+(it.f?' — التصحيح: '+it.f:''));f.appendChild(t)}
if(it.p){f.appendChild(hh('div','qmute','المرجع: كتابك ص '+it.p))}
var row=hh('div','qrow');var ex=hh('button','chip','اشرح لي من الكتاب');ex.onclick=function(){qclose();ask('اشرح لي: '+it.q+' (الجواب: '+it.a+')')};row.appendChild(ex);
var nx=hh('button','qgo',QZ.i+1>=QZ.run.length?'شوف النتيجة':'التالي');nx.onclick=function(){QZ.i++;QZ.i>=QZ.run.length?qend():qq()};row.appendChild(nx);f.appendChild(row);box.appendChild(f)}
function qq(){var it=QZ.run[QZ.i],b=document.getElementById('qbody');b.innerHTML='';var k=qkind(it);
var bar=hh('div','qbar');var bi=hh('i');bi.style.width=(QZ.i/QZ.run.length*100)+'%';bar.appendChild(bi);b.appendChild(bar);
b.appendChild(hh('div','qmeta','السؤال '+(QZ.i+1)+' من '+QZ.run.length+(it.u?' · '+it.u:'')+' · نتيجتك '+QZ.score));
b.appendChild(hh('div','qq',it.q));var box=hh('div','qbox');b.appendChild(box);var fin=false;
function mark(ok){if(fin)return;fin=true;if(ok)QZ.score++;else QZ.miss.push(it)}
if(k==='mcq'){var ci=qopt(it),btns=[];it.o.forEach(function(o,idx){var e=hh('button','opt',o);btns.push(e);e.onclick=function(){if(fin)return;var ok=idx===ci;mark(ok);btns.forEach(function(x,j){x.disabled=true;if(j===ci)x.classList.add('ok');else if(j===idx)x.classList.add('bad')});qfb(b,ok,it,false)};box.appendChild(e)})}
else if(k==='tf'){var right=qn(it.a).indexOf('صح')===0,tb=[];['صح','خطأ'].forEach(function(o,idx){var e=hh('button','opt',o);tb.push(e);e.onclick=function(){if(fin)return;var pick=idx===0,ok=pick===right;mark(ok);tb.forEach(function(x,j){x.disabled=true;if((j===0)===right)x.classList.add('ok');else if(j===idx)x.classList.add('bad')});qfb(b,ok,it,false)};box.appendChild(e)})}
else{var ta=hh('textarea','qans');ta.rows=3;ta.placeholder='اكتب إجابتك هنا (اختياري) ثم اعرض الإجابة الصحيحة';box.appendChild(ta);var sh=hh('button','qgo','اعرض الإجابة');box.appendChild(sh);
sh.onclick=function(){sh.remove();ta.readOnly=true;var m=hh('div','qmodel');m.appendChild(hh('b',null,'الإجابة النموذجية'));m.appendChild(hh('div',null,it.a));if(it.p)m.appendChild(hh('div','qmute','المرجع: كتابك ص '+it.p));box.appendChild(m);
var row=hh('div','qrow');var y=hh('button','opt ok','عرفتها ✓'),n=hh('button','opt bad','ما عرفتها ✗');
function after(ok){mark(ok);row.remove();var f=hh('div','qfb '+(ok?'ok':'bad'));f.appendChild(hh('b',null,ok?'ممتاز!':'لا بأس، راجعها'));var r2=hh('div','qrow');var ex=hh('button','chip','اشرح لي من الكتاب');ex.onclick=function(){qclose();ask('اشرح لي: '+it.q)};r2.appendChild(ex);var nx=hh('button','qgo',QZ.i+1>=QZ.run.length?'شوف النتيجة':'التالي');nx.onclick=function(){QZ.i++;QZ.i>=QZ.run.length?qend():qq()};r2.appendChild(nx);f.appendChild(r2);b.appendChild(f)}
y.onclick=function(){after(true)};n.onclick=function(){after(false)};row.appendChild(y);row.appendChild(n);box.appendChild(row)}}
window.scrollTo(0,0);document.getElementById('quiz').scrollTop=0}
function qend(){var b=document.getElementById('qbody');b.innerHTML='';var t=QZ.run.length,p=Math.round(QZ.score/t*100);
b.appendChild(hh('h2','qh',QZ.score+' من '+t+' ('+p+'%)'));
b.appendChild(hh('p','qmute',p>=85?'ممتاز! أنت جاهز.':p>=60?'جيد، راجع الأسئلة اللي غلطت فيها.':'لا تشيل هم، راجع الدرس وأعد المحاولة.'));
if(QZ.miss.length){b.appendChild(hh('div','qlab','أسئلة غلطت فيها'));QZ.miss.forEach(function(it){var d=hh('details','qmiss');d.appendChild(hh('summary',null,it.q));d.appendChild(hh('div','qmodel','الجواب: '+it.a+(it.p?' (كتابك ص '+it.p+')':'')));b.appendChild(d)})}
var row=hh('div','qrow');if(QZ.miss.length){var re=hh('button','chip','أعد الأسئلة اللي غلطت فيها');re.onclick=function(){QZ.run=qshuf(QZ.miss);QZ.i=0;QZ.score=0;QZ.miss=[];qq()};row.appendChild(re)}
var nw=hh('button','qgo','اختبار جديد');nw.onclick=qstart;row.appendChild(nw);b.appendChild(row);document.getElementById('quiz').scrollTop=0}
document.getElementById('qz').onclick=function(){if(!busy)qopen()};document.getElementById('qx').onclick=qclose;

var MODES=[['اشرح درس','اشرح لي درس '],['اختبرني','اختبرني في درس '],['حل تمرين','ساعدني أحل هذا السؤال: ']];
MODES.forEach(function(m){var b=document.createElement('button');b.type='button';b.className='chip';b.textContent=m[0];b.onclick=function(){if(busy)return;var q=$('q');q.value=m[1];q.focus();grow()};$('modes').appendChild(b)});
