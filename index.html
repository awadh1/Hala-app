  return null;
}

var beat = null;
var searchPaintTimer = null;
var typingActive = false;
function pen(code) {
  var at = N('input', { type: 'datetime-local', 'data-slot': 'when', value: V.whenVal,
    oninput: function (e) { V.whenVal = e.target.value; } });
  var MSG_MAX = 4000;   // حد معقول جداً لأي رسالة نصية، يمنع لصق نص ضخم بالغلط
  var area = N('textarea', { rows: 1, placeholder: V.editingMsg ? 'عدّل رسالتك' : 'اكتب رسالة', 'data-slot': 'pen', maxlength: String(MSG_MAX),
    oninput: function (e) {
      var wasEmpty = !V.note.trim();
      V.note = e.target.value.slice(0, MSG_MAX);
      var isEmpty = !V.note.trim();
      e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 112) + 'px';
      // نبلّغ "أكتب" مرة وحدة بس عند البداية، مو مع كل حرف —
      // إرسال حدث شبكة مع كل ضغطة كان يسبب تجمّد ملحوظ وقت الكتابة السريعة.
      if (!typingActive) { typingActive = true; typingPing(code, true); }
      clearTimeout(beat);
      beat = setTimeout(function () { typingActive = false; typingPing(code, false); }, 1700);
      // زر الإرسال يتحول لمايك لما الصندوق فاضي، وبالعكس — هذا التحول
      // بس (مو كل حرف) يستاهل إعادة رسم، عشان الزر يتبدّل فوراً لما تبدأ
      // تكتب أو تمسح كل شي، بدون ما نرجع لمشكلة التعليق اللي صلّحناها قبل.
      if (wasEmpty !== isEmpty) paint();
    },
    onkeydown: function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); fire(); } }
  });
  area.value = V.note;

  function fire() {
    var body = V.note.trim().slice(0, MSG_MAX);
    if (!body) return;
    if (V.editingMsg) {
      var editingId = V.editingMsg;
      V.editingMsg = null; V.note = '';
      editMsg(code, editingId, body);   // ينادي paint() بنفسه — رسمة وحدة تعكس التعديل ومسح الصندوق معاً
      return;
    }
    var open = (V.timed && V.whenVal) ? new Date(V.whenVal).getTime() : null;
    var replyTo = V.replyTo;
    V.note = ''; V.timed = false; V.pad = false; V.whenVal = ''; V.replyTo = null;
    typingActive = false;
    clearTimeout(beat);
    typingPing(code, false);
    post(code, body, open, null, null, replyTo);   // ينادي paint() بنفسه — رسمة وحدة تعكس الرسالة الجديدة ومسح الصندوق معاً.
    // (قبل هذا الإصلاح، كنا ننادي paint() مرة ثانية هنا بعد post() — رسمتين
    // متتاليتين لكل رسالة كانت تمسح علامة "جديدة" قبل ما تظهر، وهذا كان
    // يسبب إعادة رسم الفقاعات القديمة بلا داعي = الاهتزاز المزعج.)
  }

  var imgInput = N('input', { type: 'file', accept: 'image/*', sty: 'display:none',
    onchange: function (e) {
      var f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      V.imgBusy = true; paint();
      prepareImageForChat(f, function (dataUrl, err) {
        V.imgBusy = false;
        if (err) { V.imgErr = err; paint(); setTimeout(function () { V.imgErr = ''; paint(); }, 3500); return; }
        postImage(code, dataUrl, '');
      });
    } });

  var rows = [];
  if (V.imgErr) rows.push(N('div', { k: 'err', sty: 'margin:0 0 6px', txt: V.imgErr }));
  if (V.editingMsg) {
    rows.push(N('div', { k: 'clock-row' }, [ic('pen', 16), N('span', { txt: 'تعديل رسالة' }),
      N('button', { k: 'gen', txt: 'إلغاء', onclick: function () { V.editingMsg = null; V.note = ''; paint(); } })]));
  }
  if (V.replyTo) {
    rows.push(N('div', { k: 'clock-row' }, [ic('reply', 16),
      N('span', { sty: 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap', txt: 'رد على ' + V.replyTo.name + ': ' + V.replyTo.body }),
      N('button', { k: 'gen', txt: 'إلغاء', onclick: function () { V.replyTo = null; paint(); } })]));
  }
  if (V.pad) {
    rows.push(N('div', { k: 'seg', sty: 'padding:6px 10px 0' }, [
      N('button', { k: V.padTab !== 'stk' ? 'on' : '', txt: 'إيموجي', onclick: function () { V.padTab = 'emoji'; paint(); } }),
      N('button', { k: V.padTab === 'stk' ? 'on' : '', txt: 'ستيكرات', onclick: function () { V.padTab = 'stk'; paint(); } })
    ]));
    if (V.padTab === 'stk') {
      rows.push(N('div', { k: 'pad-row sticker-row' }, STICKERS.map(function (s) {
        return N('button', { title: s.name, onclick: function () { V.pad = false; postSticker(code, s); } },
          [N('img', { src: s.src, alt: s.name, sty: 'width:44px;height:44px;display:block' })]);
      })));
    } else {
      rows.push(N('div', { k: 'pad-row' }, ['😀','😂','🥲','😍','😎','🤔','👍','🙏','🔥','❤️','🎉','💯','😴','🤝','👏','🌙','☕','⚽'].map(function (e) {
        return N('button', { txt: e, onclick: function () { V.note += e; paint(); } });
      })));
    }
  }
  if (V.timed) {
    rows.push(N('div', { k: 'clock-row' }, [ic('time', 17), N('span', { txt: 'تنفتح الرسالة:' }), at,
      N('span', { txt: 'تنبيه: أي أحد بالشبكة يقدر يشوف بيانات الرسالة وقت إرسالها، بس الشاشة تخفيها عنه لين وقتها.' })]));
  }
  if (V.recordErr) rows.push(N('div', { k: 'err', sty: 'margin:0 12px 6px', txt: V.recordErr }));
  var hasText = !!V.note.trim();
  var micBtn = hasText
    ? N('button', { k: 'go', title: 'إرسال', 'aria-label': 'إرسال', onclick: fire }, [ic('plane', 21)])
    : N('button', { k: 'go' + (V.recording ? ' rec' : ''), title: 'اضغط مطوّل عشان تسجّل صوت', 'aria-label': 'تسجيل صوتي',
        onpointerdown: function (e) { e.preventDefault(); startRecording(code); },
        onpointerup: function () { stopRecording(code, true); },
        onpointerleave: function () { if (V.recording) stopRecording(code, true); },
        onpointercancel: function () { if (V.recording) stopRecording(code, false); }
      }, [ic('mic', 21)]);
  rows.push(N('div', { k: 'write-row' }, [
    N('button', { k: 'ico' + (V.pad ? ' act' : ''), title: 'إيموجي وستيكرات', 'aria-label': 'إيموجي وستيكرات', onclick: function () { V.pad = !V.pad; paint(); } }, [ic('face', 23)]),
    N('button', { k: 'ico', title: V.imgBusy ? 'جاري التجهيز…' : 'إرسال صورة', 'aria-label': 'إرسال صورة', disabled: V.imgBusy ? 'disabled' : null,
      onclick: function () { imgInput.click(); } }, [ic('cam', 22)]),
    imgInput,
    N('button', { k: 'ico' + (V.timed ? ' act' : ''), title: 'رسالة موقوتة', 'aria-label': 'رسالة موقوتة', onclick: function () { V.timed = !V.timed; paint(); } }, [ic('time', 22)]),
    N('button', { k: 'ico', title: 'ابدأ لعبة إكس-أو', 'aria-label': 'لعبة إكس-أو', onclick: function () { startGame(code); } }, [ic('grid', 22)]),
    V.recording
      ? N('div', { k: 'box rec-box' }, [N('span', { k: 'rec-dot' }), N('span', { txt: 'جاري التسجيل… ' + fmtDur(Date.now() - V.recordStart) })])
      : N('div', { k: 'box' }, [area]),
    micBtn
  ]));
  return N('div', { k: 'write' }, rows);
}

/* ---------- نافذة إنشاء/انضمام لغرفة ---------- */
function dialog() {
  var TITLE_MAX = 60, CODE_MAX = 80;
  function shut() { V.sheet = false; paint(); }

  function goGroup() {
    var code = V.code.trim().slice(0, CODE_MAX);
    if (!code) return;
    var isCreating = V.dtab === 'newgroup';
    // بالإنشاء: نمرر الاسم اللي كتبه المنشئ وننشره كأدمن. بالانضمام: ما
    // نمرر أي اسم إطلاقاً — الاسم الصحيح يوصل تلقائياً من مزامنة الأدمن،
    // وما نبيه يظهر حقل "سمّي المجموعة" لأي حد ينضم غير اللي أنشأها.
    var r = joinRoom(code, isCreating ? (V.title.trim().slice(0, TITLE_MAX) || code) : null, 'group', isCreating);
    V.open = r.code; V.sheet = false; markSeen(r.code); paint();
  }
  function goFriend() {
    var uname = V.code.trim().toLowerCase();
    if (!uname || V.busy) return;
    V.busy = true; V.fidErr = ''; paint();
    addFriendByUsername(uname, function (res) {
      V.busy = false;
      if (res.error) { V.fidErr = res.error; paint(); return; }
      V.open = res.room.code; V.sheet = false; markSeen(res.room.code); paint();
    });
  }

  var body = [];
  if (V.dtab === 'friend') {
    body.push(N('div', { k: 'txt-fld' }, [
      N('label', { k: 'fld-lab', txt: 'اسم مستخدم صاحبك' }),
      N('input', { value: V.code, 'data-slot': 'gc', dir: 'ltr', placeholder: 'مثلاً: salem', maxlength: '20',
        oninput: function (e) { V.code = e.target.value.toLowerCase().replace(/[^a-z0-9_]/g, ''); },
        onkeydown: function (e) { if (e.key === 'Enter') goFriend(); } })
    ]));
    if (V.fidErr) body.push(N('div', { k: 'err', sty: 'margin:0 16px 14px', txt: V.fidErr }));
    body.push(N('p', { k: 'hint-line', txt: 'اطلب من صاحبك اسم المستخدم حقّه، واكتبه هنا. ما يحتاج رمز يدوي.' }));
  } else if (V.dtab === 'newgroup') {
    body.push(N('div', { k: 'txt-fld' }, [
      N('label', { k: 'fld-lab', txt: 'اسم المجموعة' }),
      N('input', { value: V.title, 'data-slot': 'gt', placeholder: 'مثلاً: شلة المدرسة', maxlength: String(TITLE_MAX),
        oninput: function (e) { V.title = e.target.value; } })
    ]));
    body.push(N('div', { k: 'txt-fld' }, [
      N('div', { k: 'fld-lab row' }, [
        N('span', { txt: 'رمز الدعوة' }),
        N('button', { k: 'gen', txt: 'رمز جديد', onclick: function () { V.code = randomCode(); paint(); } })
      ]),
      N('div', { k: 'code-box' }, [
        N('b', { txt: V.code }),
        N('button', { title: 'نسخ', 'aria-label': 'نسخ الرمز', onclick: function () { copyText(V.code); } }, [ic('copy', 17)])
      ])
    ]));
    body.push(N('p', { k: 'hint-line', txt: 'أرسل هذا الرمز لأعضاء المجموعة، وخلّهم يضغطون "انضم لمجموعة" ويكتبونه.' }));
  } else {
    body.push(N('div', { k: 'txt-fld' }, [
      N('label', { k: 'fld-lab', txt: 'رمز الدعوة اللي أرسلوه لك' }),
      N('input', { value: V.code, 'data-slot': 'gc', dir: 'ltr', placeholder: 'الصق الرمز هنا', maxlength: String(CODE_MAX),
        oninput: function (e) { V.code = e.target.value; },
        onkeydown: function (e) { if (e.key === 'Enter') goGroup(); } })
    ]));
    body.push(N('p', { k: 'hint-line', txt: 'اسم المجموعة وصورتها يجيبهم التطبيق تلقائياً من الأدمن — ما تحتاج تكتبهم.' }));
  }

  var goFn = V.dtab === 'friend' ? goFriend : (V.dtab === 'newgroup' ? goGroup : goGroup);
  var btnLabel = V.dtab === 'friend' ? (V.busy ? 'جاري البحث…' : 'أضف الصديق') : (V.dtab === 'newgroup' ? 'إنشاء ودخول' : 'انضم للمجموعة');

  var kids = [
    N('div', { k: 'sheet-h' }, [
      N('button', { k: 'ico', title: 'إغلاق', 'aria-label': 'إغلاق', onclick: shut }, [ic('shut', 21)]),
      N('b', { txt: 'دردشة جديدة' })
    ]),
    N('div', { k: 'seg' }, [
      N('button', { k: V.dtab === 'friend' ? 'on' : '', txt: 'صديق جديد',
        onclick: function () { V.dtab = 'friend'; V.code = ''; V.fidErr = ''; paint(); } }),
      N('button', { k: V.dtab === 'newgroup' ? 'on' : '', txt: 'إنشاء مجموعة',
        onclick: function () { V.dtab = 'newgroup'; V.code = randomCode(); V.title = ''; paint(); } }),
      N('button', { k: V.dtab === 'joingroup' ? 'on' : '', txt: 'انضم لمجموعة',
        onclick: function () { V.dtab = 'joingroup'; V.code = ''; V.title = ''; paint(); } })
    ]),
    N('div', { k: 'sheet-b' }, body),
    N('div', { k: 'sheet-f' }, [N('button', { k: 'btn', txt: btnLabel, disabled: V.busy ? 'disabled' : null, onclick: goFn })])
  ];
  return N('div', { k: 'veil', onclick: shut }, [N('div', { k: 'sheet', onclick: function (e) { e.stopPropagation(); } }, kids)]);
}

/* ---------- نافذة تعديل البروفايل ---------- */

  var kids = [
    N('div', { k: 'sheet-h' }, [
      N('button', { k: 'ico', title: 'إغلاق', 'aria-label': 'إغلاق', onclick: shut }, [ic('shut', 21)]),

    ]),
    N('div', { k: 'sheet-b' }, [
      N('div', { k: 'pick-row' }, [pic, fileInput]),
      N('div', { k: 'txt-fld' }, [
        N('label', { k: 'fld-lab', txt: 'اسمك' }),
        N('input', { value: V.editName, 'data-slot': 'pn', maxlength: String(NAME_MAX),
          oninput: function (e) { V.editName = e.target.value; } })
      ]),
      N('div', { k: 'txt-fld' }, [
        N('label', { k: 'fld-lab', txt: 'اسم المستخدم حقّك (يضيفك فيه أصحابك)' }),
        N('div', { k: 'code-box' }, [
          N('b', { txt: '@' + ME.username }),

}

/* ---------- نافذة الإعدادات ---------- */
/* ---------- واجهة المكالمة — تظهر فوق كل شي، بكل حالاتها ---------- */
function fmtDur(ms) {
  var s = Math.floor(ms / 1000), m = Math.floor(s / 60);
  return z(m) + ':' + z(s % 60);
}
function callOverlay() {
  if (!CALL) return null;
  var av = CALL.peerAvatar
    ? N('img', { k: 'call-photo', src: CALL.peerAvatar, alt: CALL.peerName })
    : avatar(CALL.peerName.slice(0, 1), roomHue(CALL.code || CALL.hash), 'l');
  // خلفية ضبابية من نفس صورة الشخص (لو موجودة) — زي فيستايم بالضبط،
  // هذا اللي يخلّي الشاشة تحس فيها إحساس المكالمة الحقيقية، مو تصميم فاضي.
  var bgStyle = CALL.peerAvatar ? "background-image:url('" + CALL.peerAvatar + "')" : '';

  if (CALL.err) {
    return N('div', { k: 'call-screen' }, [
      ic('phone', 40), N('p', { sty: 'margin-top:14px;color:#fff', txt: CALL.err })
    ]);
  }

  if (CALL.state === 'ringing') {
    var handle = N('div', { k: 'call-handle' }, [ic(CALL.withVideo ? 'vid' : 'phone', 24)]);
    var drag = { on: false, x: 0, sx: 0 };
    // مهم: الصفحة RTL — يعني بالتخطيط، زر الرفض (الأحمر) يطلع فعلياً
    // يمين الشاشة، وزر القبول (الأخضر) يسارها (أول عنصر بترتيب HTML
    // يطلع يمين بالـ RTL). سحب المقبض يمين (قيمة موجبة) لازم يودّي
    // لجهة الأحمر = رفض، وسحبه يسار (قيمة سالبة) لجهة الأخضر = قبول.
    function dragMove(clientX) {
      if (!drag.on) return;
      drag.x = Math.max(-92, Math.min(92, clientX - drag.sx));
      handle.style.transform = 'translateX(' + drag.x + 'px)';
      handle.style.background = drag.x > 46 ? 'var(--bad)' : drag.x < -46 ? '#2FBF71' : '';
    }
    function dragEnd() {
      if (!drag.on) return;
      drag.on = false;
      if (drag.x > 78) rejectCall();
      else if (drag.x < -78) acceptCall();
      else { handle.style.transform = ''; handle.style.background = ''; }
    }
    handle.addEventListener('pointerdown', function (e) { drag.on = true; drag.sx = e.clientX; try { handle.setPointerCapture(e.pointerId); } catch (er) {} });
    handle.addEventListener('pointermove', function (e) { dragMove(e.clientX); });
    handle.addEventListener('pointerup', dragEnd);
    handle.addEventListener('pointercancel', dragEnd);

    return N('div', { k: 'call-screen', sty: bgStyle }, [
      N('div', { k: 'call-bg-shade' }),
      N('div', { k: 'call-who' }, [N('div', { k: 'call-photo-ring' }, [av]), N('b', { txt: CALL.peerName }), N('span', { txt: (CALL.withVideo ? 'مكالمة فيديو' : 'مكالمة صوتية') + ' واردة…' })]),
      N('div', { k: 'call-swipe' }, [
        N('div', { k: 'call-swipe-side bad' }, [ic('shut', 22)]),
        handle,
        N('div', { k: 'call-swipe-side ok' }, [ic(CALL.withVideo ? 'vid' : 'phone', 20)])
      ]),
      N('p', { k: 'call-hint', txt: 'اسحب المقبض يمين تقبل، يسار ترفض' }),
      N('div', { k: 'call-actions' }, [
        N('div', { k: 'call-btn-wrap' }, [N('button', { k: 'call-btn bad', title: 'رفض', 'aria-label': 'رفض', onclick: rejectCall }, [ic('shut', 26)]), N('span', { txt: 'رفض' })]),
        N('div', { k: 'call-btn-wrap' }, [N('button', { k: 'call-btn ok', title: 'قبول', 'aria-label': 'قبول', onclick: acceptCall }, [ic(CALL.withVideo ? 'vid' : 'phone', 24)]), N('span', { txt: 'قبول' })])
      ])
    ]);
  }

  if (CALL.state === 'calling' || CALL.state === 'connecting') {
    return N('div', { k: 'call-screen', sty: bgStyle }, [
      N('div', { k: 'call-bg-shade' }),
      N('div', { k: 'call-who' }, [N('div', { k: 'call-photo-ring' }, [av]), N('b', { txt: CALL.peerName }), N('span', { txt: CALL.state === 'calling' ? 'يرن…' : 'يتصل…' })]),
      N('div', { k: 'call-actions' }, [
        N('div', { k: 'call-btn-wrap' }, [N('button', { k: 'call-btn bad', title: 'إلغاء', 'aria-label': 'إلغاء', onclick: endCall }, [ic('shut', 26)]), N('span', { txt: 'إنهاء' })])
      ])
    ]);
  }

  // متصلة فعلياً
  var vids = [];
  if (CALL.withVideo) {
    vids.push(N('video', { k: 'call-remote', autoplay: 'autoplay', playsinline: 'playsinline',
      ref: function (el) { if (el && CALL.remoteStream && el.srcObject !== CALL.remoteStream) el.srcObject = CALL.remoteStream; } }));
    vids.push(N('video', { k: 'call-local', autoplay: 'autoplay', muted: 'muted', playsinline: 'playsinline',
      ref: function (el) { if (el && CALL.localStream && el.srcObject !== CALL.localStream) el.srcObject = CALL.localStream; } }));
  }
  return N('div', { k: 'call-screen' + (CALL.withVideo ? ' vid' : ''), sty: CALL.withVideo ? '' : bgStyle }, [CALL.withVideo ? null : N('div', { k: 'call-bg-shade' })].concat(vids).concat([
    N('div', { k: 'call-who' }, [CALL.withVideo ? null : N('div', { k: 'call-photo-ring' }, [av]), N('b', { txt: CALL.peerName }),
      N('span', { txt: fmtDur(Date.now() - CALL.startedAt) })]),
    N('div', { k: 'call-actions' }, [
      N('div', { k: 'call-btn-wrap' }, [N('button', { k: 'call-btn' + (CALL.muted ? ' on' : ''), title: CALL.muted ? 'شغّل الصوت' : 'كتم', 'aria-label': 'كتم', onclick: toggleMute }, [ic('mic', 22)]), N('span', { txt: CALL.muted ? 'مكتوم' : 'كتم' })]),
      CALL.withVideo ? N('div', { k: 'call-btn-wrap' }, [N('button', { k: 'call-btn' + (CALL.videoOff ? ' on' : ''), title: 'الكاميرا', 'aria-label': 'الكاميرا', onclick: toggleCallVideo }, [ic('vid', 21)]), N('span', { txt: 'كاميرا' })]) : null,
      N('div', { k: 'call-btn-wrap' }, [N('button', { k: 'call-btn bad', title: 'إنهاء', 'aria-label': 'إنهاء المكالمة', onclick: endCall }, [ic('shut', 26)]), N('span', { txt: 'إنهاء' })])
    ])
  ]));
}

function soonDialog() {
  function shut() { V.soonSheet = false; paint(); }
  var direct = ROOMS.filter(function (r) { return r.kind === 'direct'; });
  var body;
  if (!direct.length) {
    body = N('div', { k: 'sheet-b', sty: 'display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 24px;text-align:center' }, [
      ic('phone', 46),
      N('p', { sty: 'margin:0;color:var(--dim);font-size:13.5px;line-height:1.7', txt: 'المكالمات موجودة! بس تحتاج تضيف صديق أول — افتح "جهات الاتصال" بالأسفل.' })
    ]);
  } else {
    body = N('div', { k: 'sheet-b' }, direct.map(function (r) {
      return N('button', { k: 'set-row', onclick: function () { V.soonSheet = false; V.open = r.code; paint(); } }, [
        roomAvatar(r, 's'), N('span', { sty: 'flex:1', txt: r.title }),
        N('span', { sty: 'color:var(--accent)', title: 'مكالمة صوتية', onclick: function (e) { e.stopPropagation(); V.soonSheet = false; startCall(r.code, false); } }, [ic('phone', 19)])
      ]);
    }).concat([N('p', { sty: 'margin:8px 16px 16px;color:var(--dim-2);font-size:11.5px;line-height:1.6',
      txt: 'اضغط أي اسم يفتح محادثته (فيها زر اتصال فوق)، أو اضغط أيقونة الهاتف تتصل فيه على طول.' })]));
  }
  var kids = [
    N('div', { k: 'sheet-h' }, [
      N('button', { k: 'ico', title: 'إغلاق', 'aria-label': 'إغلاق', onclick: shut }, [ic('shut', 21)]),
      N('b', { txt: 'الاتصالات' })
    ]),
    body
  ];
  return N('div', { k: 'veil', onclick: shut }, [N('div', { k: 'sheet', onclick: function (e) { e.stopPropagation(); } }, kids)]);
}

function settingsDialog() {
  function shut() { V.settingsSheet = false; paint(); }
  var kids = [
    N('div', { k: 'sheet-h' }, [
      N('button', { k: 'ico', title: 'إغلاق', 'aria-label': 'إغلاق', onclick: shut }, [ic('shut', 21)]),
      N('b', { txt: 'الإعدادات' })
    ]),
    N('div', { k: 'sheet-b' }, [
      N('button', { k: 'set-row', onclick: function () { V.settingsSheet = false; V.profileSheet = true; V.editName = ME.name; V.editAvatar = ME.avatar || null; paint(); } },
        [ic('one', 20), N('span', { txt: 'البروفايل — الاسم والصورة والرقم' })]),
      N('button', { k: 'set-row', onclick: function () { copyText(ME.username); } },
        [ic('hash', 20), N('span', { txt: 'نسخ اسم المستخدم (@' + ME.username + ')' })]),
      N('div', { k: 'set-row', sty: 'flex-direction:column;align-items:stretch;gap:8px' }, [
        N('div', { sty: 'display:flex;align-items:center;gap:14px' }, [ic('moon', 20), N('span', { sty: 'flex:1', txt: 'المظهر' })]),
        N('div', { k: 'seg', sty: 'padding:0' }, [
          N('button', { k: THEME === 'light' ? 'on' : '', txt: 'فاتح', onclick: function () { setTheme('light'); } }),
          N('button', { k: THEME === 'dark' ? 'on' : '', txt: 'غامق', onclick: function () { setTheme('dark'); } }),
          N('button', { k: THEME === 'auto' ? 'on' : '', txt: 'تلقائي', onclick: function () { setTheme('auto'); } })
        ])
      ]),
      N('button', { k: 'set-row', onclick: toggleNotif },
        [ic('bell', 20), N('span', { sty: 'flex:1', txt: 'تنبيهات المتصفح' }), N('span', { k: 'mark' + (V.notifOn ? ' on' : ''), sty: 'display:grid' }, V.notifOn ? [ic('ok', 13)] : [])]),
      V.pushStatus ? N('p', { sty: 'margin:0 16px 8px;font-size:11.5px;color:var(--dim);line-height:1.6', txt: 'حالة الاشتراك: ' + V.pushStatus }) : null,
      V.notifOn ? N('button', { k: 'gen', sty: 'display:block;margin:0 16px 14px;font-size:12.5px', onclick: sendTestPush }, [document.createTextNode('🔔 أرسل تنبيه تجريبي لنفسي')]) : null,
      N('div', { k: 'set-note' }, [ic('note', 15), N('span', { txt: 'حسابك محفوظ باسم المستخدم والرمز السري — تقدر تسجّل دخول فيه من أي جهاز، حتى لو مسحت بيانات المتصفح.' })]),
      N('button', { k: 'set-row', onclick: function () { window.open('privacy.html', '_blank'); } },
        [ic('note', 20), N('span', { txt: 'سياسة الخصوصية' })]),
      N('button', { k: 'set-row', onclick: function () { window.open('terms.html', '_blank'); } },
        [ic('note', 20), N('span', { txt: 'قوانين الاستخدام' })]),
      N('button', { k: 'set-row bad', onclick: function () { logout(); paint(); } },
        [ic('out', 20), N('span', { txt: 'تسجيل الخروج' })]),
      N('button', { k: 'set-row bad', onclick: function () {
        if (!confirm('تحذف حسابك نهائياً؟ رسائلك تتحذف من كل محادثاتك، وحسابك ما يرجع.')) return;
        if (!confirm('متأكد ١٠٠٪؟ ما فيه رجوع بعد كذا.')) return;
        deleteAccountForever();
      } }, [ic('trash', 20), N('span', { txt: 'حذف حسابي نهائياً' })])
    ])
  ];
  return N('div', { k: 'veil', onclick: shut }, [N('div', { k: 'sheet', onclick: function (e) { e.stopPropagation(); } }, kids)]);
}

/* ---------- إغلاق القوائم ---------- */
document.addEventListener('click', function () { if (V.emos !== null || V.menu) { V.emos = null; V.menu = false; paint(); } });
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (V.emos !== null || V.menu) { V.emos = null; V.menu = false; paint(); }
  else if (V.sheet) { V.sheet = false; paint(); }
  else if (V.open) { V.open = null; paint(); }
});

/* ---------- نبضات محلية: موقوتة + تنظيف مؤشرات الكتابة القديمة ---------- */
var lastTapSig = '';
setInterval(function () {
  if (!ME) return;
  var t = Date.now(), due = false;
  for (var h in MSGS) for (var i = 0; i < MSGS[h].length; i++) {
    var m = MSGS[h][i];
    if (m.open && m.open <= t && m.open > t - 1100) { due = true; break; }
  }
  var live = [];
  if (V.open) { var hh = fnv(V.open.trim().toLowerCase()); var tp = TAPS[hh] || {};
    for (var id in tp) if (t - tp[id].t <= 3500) live.push(id); }
  var sig = live.sort().join(',');
  if (due || sig !== lastTapSig) { lastTapSig = sig; paint(); }
}, 900);

setInterval(function () {
  if (ME && V.open && document.hasFocus()) markSeen(V.open);
}, 1500);

// نسجّل عامل الخدمة (شرط تقني عشان المتصفح ومولّدات APK يعتبرون
// الصفحة تطبيق ويب تقدمي قابل للتثبيت). لو فشل لأي سبب، نتجاهله
// بهدوء — التطبيق يشتغل عادي بدونه، بس ما يصير "قابل للتثبيت".
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}

// لو المستخدم مسجّل دخول أصلاً (فتح التطبيق عادي، مو أول تسجيل) وعنده
// التنبيهات مفعّلة من قبل، نتأكد الاشتراك بتنبيهات الدفع موجود وصالح —
// بدون هذا السطر، تفعيل قديم للتنبيهات (من قبل ما نضيف هذي الميزة)
// ما يشترك تلقائياً؛ يحتاج لمسة وحدة هنا كل ما يفتح التطبيق.
if (ME && V.notifOn) subscribeToPush();

paint();
</script>
