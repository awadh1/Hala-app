<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>هلا شات — أونلاين</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#3B82F6">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="هلا شات">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EFF6FC; --panel:#FFFFFF; --panel-2:#F4F7FB; --panel-3:#EAF0F9;
  --in:#FFFFFF; --out:#DCEBFF; --accent:#3B82F6; --accent-hi:#5B9BFA;
  --text:#1A1F36; --dim:#8A93A6; --dim-2:#B0B8C7; --edge:#EAEFF6;
  --seen:#3B82F6; --warn:#E7A93B; --bad:#EF4444; --online:#34C759;
  --grad:linear-gradient(135deg,var(--accent) 0%,var(--accent-hi) 100%);
  --grad-out:linear-gradient(165deg,#DCEBFF 0%,#CFE3FF 100%);
  --font:'Noto Sans Arabic',-apple-system,'Segoe UI',Roboto,sans-serif;
  --display:'Noto Sans Arabic',-apple-system,sans-serif;
  --ease:cubic-bezier(.22,.7,.32,1);
  --shade-1:0 1px 3px rgba(30,50,90,.06);
  --shade-2:0 10px 26px rgba(30,50,90,.1),0 2px 8px rgba(30,50,90,.06);
  --shade-3:0 18px 44px rgba(30,50,90,.16),0 4px 14px rgba(30,50,90,.08);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body,#root{height:100%;margin:0}
body{background:linear-gradient(180deg,#E4F0FC 0%,#F7FAFD 320px,var(--bg) 320px);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,textarea{font:inherit;color:inherit;border:none;background:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
svg{display:block;flex:none}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-thumb{background:#D3DCEA;border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:#B9C6DA}
::-webkit-scrollbar-track{background:transparent}

/* ═══ الدخول ═══ */
.auth{min-height:100%;display:flex;flex-direction:column;background:linear-gradient(180deg,#E4F0FC 0%,var(--bg) 100%)}
.auth-top{height:180px;flex:none;background:transparent}
.auth-wrap{flex:1;margin-top:-116px;padding:0 16px 48px;display:flex;justify-content:center}
.auth-card{width:min(432px,100%);background:var(--panel);border-radius:20px;box-shadow:var(--shade-2);padding:36px 38px 38px;
  border:1px solid rgba(59,130,246,.08)}
.brand{display:flex;align-items:center;gap:11px;justify-content:center;margin-bottom:26px}
.brand svg{color:var(--accent)}
.brand b{font-family:var(--display);font-size:24px;font-weight:800;letter-spacing:-.3px;color:var(--text)}
.auth-card h1{font-size:19px;font-weight:700;margin:0 0 5px;text-align:center;letter-spacing:-.1px;color:var(--text)}
.auth-card .sub{margin:0 0 24px;color:var(--dim);font-size:13.5px;text-align:center}
.fld{margin-bottom:18px}
.pick-row{display:flex;justify-content:center;margin-bottom:22px}
.pick-avatar{border-radius:50%;position:relative;transition:transform .18s var(--ease)}
.pick-avatar:hover{transform:scale(1.04)}
.pick-avatar:active{transform:scale(.98)}
.pick-avatar .avatar{color:var(--dim);border:2px dashed var(--dim-2);background:var(--panel-2) !important}
.pick-avatar .cam-badge{position:absolute;bottom:-2px;left:-2px;width:24px;height:24px;border-radius:50%;
  background:var(--grad);color:#fff;display:grid;place-items:center;border:3px solid var(--panel);box-shadow:var(--shade-1)}
.who-fid{font-size:11px;color:var(--dim);white-space:nowrap;display:flex;align-items:center;gap:3px;font-family:monospace;direction:ltr}
.who-fid button{color:var(--accent);display:inline-flex}
.fld label{display:block;font-size:12px;color:var(--accent);margin-bottom:6px;font-weight:700;letter-spacing:.1px}
.fld input{width:100%;padding:9px 3px;border-bottom:2px solid var(--edge);transition:border-color .2s var(--ease);color:var(--text)}
.fld input:focus{outline:none;border-bottom-color:var(--accent)}
.fld .note{font-size:11.5px;color:var(--dim-2);margin-top:5px}
.btn{width:100%;padding:13px;border-radius:14px;background:var(--grad);color:#fff;font-weight:700;font-size:15px;
  transition:filter .16s var(--ease),transform .1s var(--ease);box-shadow:0 8px 20px rgba(59,130,246,.28)}
.btn:hover{filter:brightness(1.05)}
.btn:active{transform:scale(.98)}
.btn[disabled]{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn[disabled]:hover{filter:none}
.alt{margin-top:20px;padding-top:18px;border-top:1px solid var(--edge);text-align:center;color:var(--dim);font-size:13.5px}
.alt button{color:var(--accent);font-weight:700}
.alt button:hover{text-decoration:underline}
.err{background:#FEF0F0;border-inline-start:3px solid var(--bad);border-radius:8px;padding:11px 13px;margin-bottom:18px;font-size:13px;color:#C0392B;line-height:1.55}
.tip{display:flex;gap:10px;background:var(--panel-2);border-radius:12px;padding:12px 13px;margin-bottom:22px;font-size:12px;color:var(--dim);line-height:1.6;border:1px solid var(--edge)}
.tip svg{color:var(--accent);margin-top:2px}

/* ═══ الهيكل ═══ */
.app{height:100%;display:flex}
.side{width:410px;max-width:38%;flex:none;background:var(--panel);display:flex;flex-direction:column;border-inline-end:1px solid var(--edge)}
.bar{height:58px;flex:none;background:var(--panel);display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--edge)}
.ico{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--dim);transition:background .15s var(--ease),color .15s var(--ease),transform .1s var(--ease);position:relative}
.ico:hover{background:var(--panel-2);color:var(--accent)}
.ico:active{transform:scale(.92)}
.ico.act{color:var(--accent);background:var(--panel-2)}
.who-am-i{display:flex;align-items:center;gap:10px;min-width:0;flex:1;text-align:start;border-radius:12px;padding:4px 6px;margin:-4px -6px;transition:background .15s var(--ease)}
.who-am-i:hover{background:var(--panel-2)}
.who-am-i .n{font-size:16px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.who-am-i .col{min-width:0;display:flex;flex-direction:column;gap:1px;align-items:center}
.who-am-i button.pick-avatar{flex:none}
.wordmark{display:block;font-size:19px;font-weight:800;letter-spacing:-.2px;color:var(--text)}
.wordmark-en{display:block;font-size:9.5px;font-weight:700;letter-spacing:2.5px;color:var(--dim);direction:ltr}

.avatar{border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;font-weight:700;user-select:none;letter-spacing:0;box-shadow:0 2px 6px rgba(30,50,90,.12)}
.avatar.s{width:34px;height:34px;font-size:13px}
.avatar.m{width:44px;height:44px;font-size:16px}
.avatar.l{width:52px;height:52px;font-size:19px}
.avatar svg{opacity:.95}
.avatar-wrap{position:relative;flex:none;display:inline-flex}
.avatar-wrap .ring{position:absolute;bottom:0;left:0;width:11px;height:11px;border-radius:50%;background:var(--online);border:2.5px solid var(--panel);opacity:0;transition:opacity .2s var(--ease)}
.avatar-wrap.online .ring{opacity:1}

.seek{padding:6px 14px 10px;flex:none}
.seek-in{display:flex;align-items:center;gap:10px;background:var(--panel-2);border-radius:14px;padding:0 14px;height:40px;transition:box-shadow .18s var(--ease);border:1px solid var(--edge)}
.seek-in:focus-within{box-shadow:0 0 0 2px rgba(59,130,246,.18);border-color:var(--accent)}
.seek-in svg{color:var(--dim-2)}
.seek-in input{flex:1;font-size:14px;min-width:0;color:var(--text)}
.seek-in input:focus{outline:none}
.seek-in input::placeholder{color:var(--dim-2)}

/* شريط التصنيفات — يظهر بس بقائمة الدردشات */
.pillbar{display:flex;gap:8px;padding:0 14px 12px;overflow-x:auto;flex:none}
.pillbar::-webkit-scrollbar{display:none}
.pillbtn{flex:none;padding:8px 18px;border-radius:20px;font-size:13px;font-weight:700;background:var(--panel);color:var(--dim);
  border:1px solid var(--edge);transition:all .15s var(--ease);white-space:nowrap}
.pillbtn.on{background:var(--grad);color:#fff;border-color:transparent;box-shadow:0 4px 12px rgba(59,130,246,.28)}
.pillbtn:not(.on):hover{background:var(--panel-2)}

.list{flex:1;overflow-y:auto;overflow-x:hidden;padding:0 8px}
.item{width:100%;display:flex;align-items:center;gap:13px;padding:10px 8px;height:76px;text-align:start;transition:background .12s var(--ease);border-radius:16px}
.item:hover{background:var(--panel-2)}
.item[aria-current=true]{background:var(--panel-2)}
.item .body{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:center;gap:3px}
.r1{display:flex;align-items:baseline;gap:8px}
.r1 .t{flex:1;min-width:0;font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px;color:var(--text)}
.r1 .w{font-size:11.5px;color:var(--dim);flex:none;letter-spacing:.1px}
.r1 .w.hot{color:var(--accent);font-weight:700}
.r2{display:flex;align-items:center;gap:7px}
.r2 .p{flex:1;min-width:0;font-size:13.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:4px}
.r2 .p svg{flex:none}
.tag{background:var(--grad);color:#fff;font-size:11px;font-weight:800;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px;flex:none;box-shadow:0 2px 7px rgba(59,130,246,.32)}
.nothing{color:var(--dim);text-align:center;padding:46px 30px;font-size:13.5px;line-height:1.9;white-space:pre-line}

/* ═══ المحادثة ═══ */
.main{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--bg)}
.void{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center;padding:40px;background:var(--bg)}
.void svg{color:var(--accent);opacity:.5}
.void h2{font-family:var(--display);font-size:28px;font-weight:800;margin:0;letter-spacing:-.3px;color:var(--text)}
.void p{margin:0;color:var(--dim);font-size:13.5px;max-width:400px;line-height:1.85}

.head{height:62px;flex:none;background:var(--panel);display:flex;align-items:center;gap:13px;padding:0 12px 0 16px;z-index:3;position:relative;border-bottom:1px solid var(--edge)}
.head .meta{flex:1;min-width:0}
.head .meta b{display:block;font-size:16.5px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.1px;color:var(--text)}
.head .meta span{display:block;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.back{display:none}

.menu{position:absolute;top:52px;inset-inline-start:12px;background:var(--panel);border-radius:14px;box-shadow:var(--shade-3);padding:6px 0;min-width:190px;z-index:30;
  border:1px solid var(--edge);animation:pop-in .14s var(--ease)}
@keyframes pop-in{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
.menu button{display:block;width:100%;text-align:start;padding:11px 22px;font-size:14px;color:var(--text);transition:background .12s var(--ease)}
.menu button:hover{background:var(--panel-2)}
.menu button.bad{color:var(--bad)}

.feed{flex:1;overflow-y:auto;padding:14px 6% 10px;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.feed::before{content:'';position:absolute;inset:0;background-image:var(--weave);background-size:150px;opacity:.035;pointer-events:none}
.feed>*{position:relative;z-index:1}

.sep{align-self:center;background:var(--panel);color:var(--dim);font-size:11.5px;font-weight:700;padding:5px 14px;border-radius:20px;margin:16px 0 10px;box-shadow:var(--shade-1);letter-spacing:.2px;border:1px solid var(--edge)}

.line{display:flex;margin-top:2px}
.line.me{justify-content:flex-end}
.line.fresh{margin-top:12px}
.line.rxd{margin-bottom:14px}

.bub{position:relative;max-width:min(64%,510px);background:var(--in);border-radius:16px;padding:7px 12px 8px;box-shadow:var(--shade-1);border:1px solid var(--edge)}
.bub.bub-in{animation:rise .18s var(--ease)}
.line.me .bub{background:var(--grad-out);border-color:rgba(59,130,246,.12)}
@keyframes rise{from{opacity:0;transform:translateY(6px) scale(.99)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bub{animation:none}}
.bub.tip-l{border-start-start-radius:4px}
.bub.tip-l::before{content:'';position:absolute;top:0;inset-inline-start:-7px;width:8px;height:14px;background:var(--in);clip-path:polygon(100% 0,0 0,100% 100%)}
.line.me .bub.tip-l::before{background:#CFE3FF;clip-path:polygon(0 0,100% 0,0 100%)}
.by{font-size:12.5px;font-weight:800;margin-bottom:2px;letter-spacing:0;color:var(--accent)}
.txt{font-size:14.6px;line-height:1.45;white-space:pre-wrap;word-break:break-word;color:var(--text)}
.gap{display:inline-block;width:58px;height:16px}
.line.me .gap{width:72px}
.stamp{position:absolute;bottom:7px;left:11px;display:flex;align-items:center;gap:3px;font-size:11px;color:var(--dim-2);white-space:nowrap;letter-spacing:.2px}
.stamp svg{width:15px;height:15px}
.stamp .ok2{color:var(--seen)}
.stamp .soon{color:var(--warn)}

.rx{position:absolute;bottom:-12px;inset-inline-start:9px;display:flex;gap:3px;z-index:2}
.rx button{background:var(--panel);border:1.5px solid var(--bg);border-radius:11px;height:22px;padding:0 6px;font-size:12px;display:flex;align-items:center;gap:3px;box-shadow:var(--shade-1);transition:transform .12s var(--ease)}
.rx button:hover{transform:translateY(-1px)}
.rx button.on{background:#E3EFFF;border-color:#E3EFFF}
.rx .c{font-size:10.5px;color:var(--dim)}

.pull{position:absolute;top:0;inset-inline-end:0;width:30px;height:26px;display:grid;place-items:center;color:var(--dim);opacity:0;transition:opacity .13s var(--ease);border-start-end-radius:15px;
  background:linear-gradient(to left,var(--in) 58%,transparent)}
.line.me .pull{background:linear-gradient(to left,#DCEBFF 58%,transparent)}
.bub:hover .pull,.pull:focus-visible{opacity:1}
.emos{position:absolute;top:-46px;inset-inline-end:-4px;background:var(--panel);border-radius:26px;padding:5px 8px;display:flex;gap:3px;box-shadow:var(--shade-3);z-index:9;border:1px solid var(--edge)}
.emos button{width:32px;height:32px;border-radius:50%;font-size:19px;display:grid;place-items:center;transition:transform .13s var(--ease)}
.emos button:hover{transform:scale(1.25)}
.emos button.on{background:#E3EFFF}

.play{background:var(--panel-2);border-radius:14px;padding:11px;margin-bottom:5px;border:1px solid var(--edge)}
.play-h{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:800;color:var(--accent);margin-bottom:9px;letter-spacing:.1px}
.net{display:grid;grid-template-columns:repeat(3,46px);gap:5px;justify-content:center}
.sq{height:46px;background:var(--panel);border-radius:10px;font-size:22px;font-weight:800;transition:background .12s var(--ease);border:1px solid var(--edge)}
.sq:hover:not([disabled]){background:#E3EFFF}
.sq[disabled]{cursor:default}
.sq.x{color:#EF4444}
.sq.o{color:var(--accent)}
.play-s{margin-top:9px;font-size:11.5px;color:var(--dim);text-align:center}

.tap{height:24px;padding:0 6% 3px;font-size:12.5px;color:var(--accent);display:flex;align-items:center;gap:7px;flex:none}
.blips{display:inline-flex;gap:3px}
.blips i{width:5px;height:5px;border-radius:50%;background:var(--accent);animation:beat 1.25s infinite}
.blips i:nth-child(2){animation-delay:.18s}
.blips i:nth-child(3){animation-delay:.36s}
@keyframes beat{0%,58%,100%{opacity:.25}28%{opacity:1}}
@media (prefers-reduced-motion:reduce){.blips i{animation:none;opacity:.65}}

.write{flex:none;background:var(--panel);padding:8px 16px 10px;border-top:1px solid var(--edge)}
.write-row{display:flex;align-items:flex-end;gap:8px}
.box{flex:1;background:var(--panel-2);border-radius:22px;padding:9px 16px;min-width:0;transition:box-shadow .18s var(--ease);border:1px solid var(--edge)}
.box:focus-within{box-shadow:0 0 0 2px rgba(59,130,246,.18);border-color:var(--accent)}
.box textarea{width:100%;resize:none;max-height:112px;font-size:14.6px;line-height:1.42;display:block;color:var(--text)}
.box textarea:focus{outline:none}
.box textarea::placeholder{color:var(--dim-2)}
.go{width:44px;height:44px;border-radius:50%;background:var(--grad);color:#fff;display:grid;place-items:center;flex:none;
  transition:filter .15s var(--ease),transform .12s var(--ease);box-shadow:0 6px 16px rgba(59,130,246,.35)}
.go:hover{filter:brightness(1.06)}
.go:active{transform:scale(.9)}
.clock-row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;background:var(--panel-2);border-radius:12px;padding:9px 13px;margin-bottom:6px;font-size:12.5px;color:var(--dim);border:1px solid var(--edge)}
.clock-row svg{color:var(--warn)}
.clock-row input{background:var(--panel);border-radius:7px;padding:5px 9px;font-size:12.5px;border:1px solid var(--edge);color:var(--text)}
.clock-row input:focus{outline:1px solid var(--accent)}
.pad-row{background:var(--panel-2);border-radius:12px;padding:8px 10px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:2px;border:1px solid var(--edge)}
.pad-row button{width:36px;height:36px;border-radius:9px;font-size:20px;display:grid;place-items:center;transition:background .12s var(--ease),transform .1s var(--ease)}
.pad-row button:hover{background:var(--panel);transform:scale(1.1)}

/* ═══ نافذة ═══ */
.veil{position:fixed;inset:0;background:rgba(20,30,50,.4);display:grid;place-items:center;padding:20px;z-index:40;animation:in .16s var(--ease);backdrop-filter:blur(3px)}
@keyframes in{from{opacity:0}to{opacity:1}}
.sheet{width:min(428px,100%);background:var(--panel);border-radius:22px;box-shadow:var(--shade-3);overflow:hidden;display:flex;flex-direction:column;max-height:min(570px,86vh);
  border:1px solid var(--edge);animation:sheet-in .2s var(--ease)}
@keyframes sheet-in{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}
.sheet-h{background:var(--panel);padding:0 16px;height:58px;display:flex;align-items:center;gap:15px;flex:none;border-bottom:1px solid var(--edge)}
.sheet-h b{font-family:var(--display);font-size:17px;font-weight:800;color:var(--text)}
.seg{display:flex;padding:8px 10px 0;gap:2px;flex:none;border-bottom:1px solid var(--edge)}
.seg button{flex:1;padding:9px 2px;font-size:12.5px;color:var(--dim);border-bottom:2px solid transparent;transition:color .15s var(--ease),border-color .15s var(--ease);white-space:nowrap;font-weight:600}
.seg button:hover{color:var(--text)}
.seg button.on{color:var(--accent);border-bottom-color:var(--accent)}
.sheet-b{overflow-y:auto;flex:1}
.txt-fld{padding:10px 16px}
.txt-fld input{width:100%;background:var(--panel-2);border-radius:11px;padding:11px 13px;font-size:14px;border:1px solid var(--edge);transition:box-shadow .15s var(--ease);color:var(--text)}
.txt-fld input:focus{outline:none;box-shadow:0 0 0 2px rgba(59,130,246,.18);border-color:var(--accent)}
.tags{display:flex;flex-wrap:wrap;gap:6px;padding:0 16px 10px}
.tags .one{background:var(--panel-2);border-radius:14px;padding:4px 6px 4px 11px;display:flex;align-items:center;gap:7px;font-size:13px;border:1px solid var(--edge)}
.tags .one button{color:var(--dim);display:grid;place-items:center}
.tags .one button:hover{color:var(--text)}
.sheet-f{padding:12px 16px 14px;flex:none;border-top:1px solid var(--edge)}
.mark{width:22px;height:22px;border-radius:50%;border:2px solid var(--dim-2);display:grid;place-items:center;flex:none;color:transparent;transition:all .15s var(--ease)}
.mark.on{background:var(--grad);border-color:transparent;color:#fff}
.set-row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;font-size:14.5px;color:var(--text);transition:background .12s var(--ease)}
.set-row:hover{background:var(--panel-2)}

</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.15.2/mqtt.min.js"></script>
<script>
/* ══════════════════════════════════════════════════════════
   هلا شات — النسخة الأونلاين
   يتصل بسيرفر MQTT خاص فينا (Render، فئة مجانية) بدل بروكر عام
   مشترك. بدون حساب، بدون تسجيل من طرف المستخدم.

   القيود اللي لازم تعرفها:
   - رمز الغرفة هو الحماية الوحيدة — أي أحد يعرفه يقدر يدخلها.
     اختر رمز طويل وغريب، وما تحطون فيها معلومات حسّاسة.
   - الفئة المجانية من Render تنيّم السيرفر بعد ١٥ دقيقة سكون.
     أول رسالة بعد فترة سكون تاخذ نص دقيقة لين يصحى.
   ══════════════════════════════════════════════════════════ */

var BROKER = 'wss://hala-chat-jh6w.onrender.com';   // سيرفرنا الخاص، بدل البروكر العام
var AQUA_URL = BROKER.replace(/^wss:\/\//, 'https://').replace(/^ws:\/\//, 'http://') + '/aqua';
var AQUA_CODE = '__aqua__';
var AQUA_MSGS = (function () { try { return JSON.parse(box.get('hala.aqua') || '[]'); } catch (e) { return []; } })();
function saveAqua() {
  var trimmed = AQUA_MSGS.length > 200 ? AQUA_MSGS.slice(AQUA_MSGS.length - 200) : AQUA_MSGS;
  box.set('hala.aqua', JSON.stringify(trimmed));
}
function sendToAqua(text) {
  AQUA_MSGS.push({ who: 'me', text: text, t: Date.now() });
  saveAqua();
  V.aquaBusy = true; V.aquaErr = '';
  paint();
  fetch(AQUA_URL, { method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify({ who: ME.id, text: text }) })
    .then(function (r) { return r.json().then(function (d) { return { ok: r.ok, d: d }; }); })
    .then(function (res) {
      V.aquaBusy = false;
      if (!res.ok) { V.aquaErr = (res.d && res.d.error) || 'صار خطأ، جرّب بعدين'; paint(); return; }
      AQUA_MSGS.push({ who: 'aqua', text: res.d.reply, t: Date.now() });
      saveAqua();
      paint();
    })
    .catch(function () {
      V.aquaBusy = false; V.aquaErr = 'ما قدرنا نوصل لأكوا — تأكد من الإنترنت';
      paint();
    });
}
var NS = 'halachat9x';   // بادئة تميّز رسائلنا عن غيرنا على نفس البروكر العام

/* هاش بسيط (FNV-1a) يحوّل رمز الغرفة إلى مقطع صالح لموضوع MQTT
   — ليس تشفيراً، مجرد تعمية شكلية */
function fnv(s) {
  var h = 0x811c9dc5;
  for (var i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return h.toString(16);
}
function roomTopic(code) { return NS + '/' + fnv(String(code).trim().toLowerCase()); }
var ROOM_HUES = ['#C97B4A','#7C5A94','#4A8B7C','#B8763F','#9C5470','#5C7A9C','#8A9C4A','#A85C8C'];
function roomHue(code) { var h = fnv(String(code).trim().toLowerCase()); return ROOM_HUES[parseInt(h.slice(0, 4), 16) % ROOM_HUES.length]; }

/* ---------- هوية الجهاز ---------- */
var cache = {};
var box = {
  get: function (k) { try { return localStorage.getItem(k); } catch (e) { return cache[k] || null; } },
  set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) { cache[k] = v; } }
};

function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36); }
var ME = (function () {
  try { var r = JSON.parse(box.get('hala.me') || 'null'); if (r && r.id && r.name && r.username) return r; } catch (e) {}
  return null;
})();
var HUES = ['#7C5A94', '#A85C8C', '#4A8B7C', '#B8763F', '#9C5470', '#C97B4A', '#5C7A9C', '#8A9C4A'];

/* تشفير كلمة السر: نستخدم SubtleCrypto (مدمجة بالمتصفح، صفر مكتبات
   خارجية) — الرمز السري نفسه ما يُنشر أبداً، بس بصمته (هاش). هذا
   أفضل من نص عادي، بس خلّك صريح مع نفسك: هذا مستوى حماية "مشروع
   شخصي"، مو مستوى بنك — لأنه بدون سيرفر حقيقي يحد محاولات الدخول. */
function hashPassword(username, password) {
  var enc = new TextEncoder();
  var data = enc.encode('halasalt9x:' + username.toLowerCase() + ':' + password);
  return crypto.subtle.digest('SHA-256', data).then(function (buf) {
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  });
}

/* دليل الحسابات: كل حساب يُنشر برسالة محفوظة (retained) على
   NS/acct/<username> — أي أحد يشترك بنفس الموضوع يشوفها فوراً. هذا
   يغنينا عن قاعدة بيانات منفصلة؛ نفس البروكر اللي عندنا يكفي كدليل. */
var PENDING_LOOKUPS = {};   // username -> [callback,...]
function lookupAccount(username, timeoutMs, cb) {
  if (!CLIENT) { cb(null); return; }
  var topic = NS + '/acct/' + username;
  var settled = false;
  function settle(data) {
    if (settled) return;
    settled = true;
    if (CLIENT) CLIENT.unsubscribe(topic);
    cb(data);
  }
  (PENDING_LOOKUPS[username] = PENDING_LOOKUPS[username] || []).push(settle);
  CLIENT.subscribe(topic);
  setTimeout(function () { settle(null); }, timeoutMs);
}
function resolveLookup(username, data) {
  var list = PENDING_LOOKUPS[username];
  if (!list) return;
  delete PENDING_LOOKUPS[username];
  list.forEach(function (fn) { fn(data); });
}

var USERNAME_RE = /^[a-z0-9_]{3,20}$/;

// إنشاء حساب: نتأكد الاسم متاح، نشفّر الرمز السري، وننشر الحساب —
// كل هذا بعد ما تكتمل خطوات نص متزامنة (اتصال + تشفير + بحث).
function register(username, password, name, avatar, onError) {
  username = String(username || '').trim().toLowerCase();
  if (!USERNAME_RE.test(username)) { onError('اسم المستخدم لازم يكون ٣-٢٠ حرف إنجليزي صغير أو رقم أو _'); return; }
  if (String(password || '').length < 6) { onError('الرمز السري لازم ٦ خانات على الأقل'); return; }
  if (!name || name.trim().length < 2) { onError('اكتب اسمك اللي يشوفه صاحبك'); return; }
  REGISTERING = true;
  ensureLink();
  var tries = 0;
  function waitLink() {
    tries++;
    if (!CLIENT || LINK !== 'up') {
      if (tries > 16) { REGISTERING = false; onError('ما قدرنا نتصل بالشبكة. تأكد من الإنترنت وحاول مرة ثانية.'); paint(); return; }
      setTimeout(waitLink, 300);
      return;
    }
    lookupAccount(username, 900, function (existing) {
      if (existing) { REGISTERING = false; onError('اسم المستخدم محجوز، جرّب غيره'); paint(); return; }
      hashPassword(username, password).then(function (hash) {
        var cid = uid();
        var hue = HUES[Math.floor(Math.random() * HUES.length)];
        var acct = { passHash: hash, id: cid, name: name.trim(), hue: hue, avatar: avatar || null };
        safePublish(NS + '/acct/' + username, JSON.stringify(acct), { qos: 1, retain: true });
        ME = { id: cid, username: username, name: name.trim(), hue: hue, avatar: avatar || null };
        box.set('hala.me', JSON.stringify(ME));
        REGISTERING = false; V.authBusy = false;
        paint();
      });
    });
  }
  waitLink();
}

// تسجيل الدخول: نلقى الحساب بالدليل، نشفّر الرمز اللي كتبه، ونقارنه
// بالمخزّن. لو تطابق، نرجّع نفس الحساب لهذا الجهاز.
function login(username, password, onError) {
  username = String(username || '').trim().toLowerCase();
  if (!username || !password) { onError('اكتب اسم المستخدم والرمز السري'); return; }
  REGISTERING = true;
  ensureLink();
  var tries = 0;
  function waitLink() {
    tries++;
    if (!CLIENT || LINK !== 'up') {
      if (tries > 16) { REGISTERING = false; onError('ما قدرنا نتصل بالشبكة. تأكد من الإنترنت وحاول مرة ثانية.'); paint(); return; }
      setTimeout(waitLink, 300);
      return;
    }
    lookupAccount(username, 1800, function (acct) {
      if (!acct) { REGISTERING = false; onError('ما فيه حساب بهذا الاسم'); paint(); return; }
      hashPassword(username, password).then(function (hash) {
        if (hash !== acct.passHash) { REGISTERING = false; onError('الرمز السري غلط'); paint(); return; }
        ME = { id: acct.id, username: username, name: acct.name, hue: acct.hue, avatar: acct.avatar || null };
        box.set('hala.me', JSON.stringify(ME));
        REGISTERING = false; V.authBusy = false;
        paint();
      });
    });
  }
  waitLink();
}

function updateProfile(name, avatar) {
  ME.name = name;
  if (avatar !== undefined) ME.avatar = avatar;
  box.set('hala.me', JSON.stringify(ME));
  // نحدّث الاسم والصورة بالدليل بدون ما نلمس بصمة الرمز السري —
  // نجيبها كما هي من آخر شي نعرفه (ما نملك كشفها، وما نحتاجها هنا أصلاً
  // إلا وقت التحقق من الدخول)، فننشر نسخة مؤقتة بالأشياء العلنية بس
  // ونعتمد إن أي جهاز يسجّل دخول لاحقاً يقرأها من آخر نسخة محفوظة.
  lookupAccount(ME.username, 900, function (acct) {
    var merged = { passHash: acct ? acct.passHash : undefined, id: ME.id, name: ME.name, hue: ME.hue, avatar: ME.avatar || null };
    safePublish(NS + '/acct/' + ME.username, JSON.stringify(merged), { qos: 1, retain: true });
  });
}
var REGISTERING = false;

// الخروج: ننسى هويتك المحلية كاملة وغرفك، ونرجع لشاشة تسجيل الدخول.
// حسابك يبقى موجود على الشبكة — ترجع له بالاسم والرمز السري من أي جهاز.
function logout() {
  if (CLIENT) { try { CLIENT.end(true); } catch (e) {} }
  CLIENT = null; LINK = 'down'; SUBBED = {};
  MSGS = {}; GAMES = {}; TAPS = {}; SEEN_UPTO = {}; PEER_SEEN = {}; PRESENCE = {}; PENDING_LOOKUPS = {}; ANIMATED_MSGS = {};
  ROOMS = [];
  box.set('hala.me', 'null');
  box.set('hala.rooms', '[]');
  box.set('hala.seen', '{}');
  ME = null; REGISTERING = false;
  V.open = null; V.sheet = false; V.profileSheet = false; V.settingsSheet = false; V.menu = false;
  // علم "مشغول" كان يعلق true بعد أول نجاح تسجيل (ما يترجع إلا بمسار
  // الخطأ)، ولو ما صفّرناه هنا، أي محاولة دخول بعد الخروج تنرفض بصمت.
  V.authBusy = false; V.authErr = ''; V.authTab = 'login';
  V.loginUsername = ''; V.loginPass = ''; V.regUsername = ''; V.regPass = ''; V.regName = ''; V.regAvatar = null;
}

// نصغّر أي صورة يختارها المستخدم لمربّع صغير قبل الإرسال —
// بدون هذا، صورة عادية من الكاميرا تكون ميجابايتات وتكسر حد حجم الرسالة
function shrinkImage(file, size, cb) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      try {
        var canvas = document.createElement('canvas');
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        var s = Math.min(img.width, img.height);
        var sx = (img.width - s) / 2, sy = (img.height - s) / 2;
        ctx.drawImage(img, sx, sy, s, s, 0, 0, size, size);
        cb(canvas.toDataURL('image/jpeg', 0.72));
      } catch (e) { cb(null); }
    };
    img.onerror = function () { cb(null); };
    img.src = reader.result;
  };
  reader.onerror = function () { cb(null); };
  reader.readAsDataURL(file);
}

function loadRooms() { try { return JSON.parse(box.get('hala.rooms') || '[]'); } catch (e) { return []; } }
function saveRooms(list) { box.set('hala.rooms', JSON.stringify(list)); }

/* حفظ محلي للرسائل والألعاب — نسخة احتياطية على جهازك.
   حتى لو تقطّع الاتصال بالشبكة أو تأخرت، تفتح المحادثة وتشوف
   آخر شي وصلك فوراً بدون ما تنتظر البروكر. سقف ٤٠٠ رسالة لكل غرفة
   عشان التخزين المحلي ما يكبر بلا حدود. */
function saveMsgs(hash) {
  var list = MSGS[hash] || [];
  var trimmed = list.length > 400 ? list.slice(list.length - 400) : list;
  box.set('hala.msgs.' + hash, JSON.stringify(trimmed));
}
function loadMsgs(hash) {
  try { return JSON.parse(box.get('hala.msgs.' + hash) || '[]'); } catch (e) { return []; }
}
function saveGames(hash) {
  var mine = {};
  for (var id in GAMES) if (GAMES[id].r === hash) mine[id] = GAMES[id];
  box.set('hala.games.' + hash, JSON.stringify(mine));
}
function loadGames(hash) {
  try {
    var saved = JSON.parse(box.get('hala.games.' + hash) || '{}');
    for (var id in saved) GAMES[id] = saved[id];
  } catch (e) {}
}

/* ---------- حالة التطبيق (كل شي هنا مؤقت بالذاكرة، يتغذى من البروكر) ---------- */
var ROOMS = loadRooms();                 // [{code, title}]
var MSGS = {};                            // topic-hash -> [msg,...]
var ANIMATED_MSGS = {};                   // id -> true — لمنع تكرار حركة الدخول بكل إعادة رسم
var GAMES = {};                           // gameId -> game
var TAPS = {};                            // topic-hash -> {clientId:{name,at}}
// عدّاد غير المقروء يعتمد عليه — لو ضاع بعد الريفريش، أي غرفة آخر
// رسالة فيها من شخص ثاني تبين "غير مقروءة" حتى لو قريتها من زمان.
var SEEN_UPTO = (function () {
  try { return JSON.parse(box.get('hala.seen') || '{}'); } catch (e) { return {}; }
})();
var PEER_SEEN = {};                       // topic-hash -> {clientId: ts} (مبثوثة عبر الشبكة، لعلامة الصح المزدوج)
var PRESENCE = {};                        // topic-hash -> {clientId: ts آخر نبضة} — عشان نعرف صاحبك متصل الآن ولا لا

var LINK = 'down';                        // down | mid | nolib | up
var CLIENT = null;
var SUBBED = {};                          // topic-hash already subscribed?

// نشر آمن: أي فشل غير متوقع بمكتبة الاتصال (مو مشكلة الشبكة العادية،
// اللي أصلاً المكتبة تتعامل معها) يُسجَّل بس، وما يوقف باقي الكود.
function safePublish(topic, payload, opts) {
  if (!CLIENT) return;
  try { CLIENT.publish(topic, payload, opts); }
  catch (e) { console.error('فشل الإرسال:', e && e.message); }
}

function ensureLink() {
  if (CLIENT) return;
  if (!ME && !REGISTERING) return;
  // لو مكتبة الاتصال ما حمّلت (نت بطيء، أو الشبكة تحجب الروابط الخارجية)،
  // ما نخلي الصفحة كلها تنهار — نعرض حالة واضحة بدالها.
  if (typeof mqtt === 'undefined' || !mqtt || typeof mqtt.connect !== 'function') {
    LINK = 'nolib';
    return;
  }
  LINK = 'mid';
  var cid = ME ? ME.id : ('anon-' + uid());
  try {
    CLIENT = mqtt.connect(BROKER, { clientId: NS + '-' + cid, clean: true, connectTimeout: 8000, reconnectPeriod: 2500 });
  } catch (e) {
    LINK = 'nolib';
    CLIENT = null;
    return;
  }

  // البروكر يرجّع لنا رسائلنا نفسها لأننا مشتركين بنفس الموضوع اللي ننشر عليه.
  // clean:true يعني الاشتراكات تنمسح من عند البروكر عند أي قطع اتصال،
  // فلازم نعيد الاشتراك من الصفر كل مرة يتصل فيها الجهاز (أول مرة أو بعد انقطاع).
  CLIENT.on('connect', function () {
    LINK = 'up'; SUBBED = {}; ROOMS.forEach(subRoom); heartbeat(); paint();
    // أول ما نتصل (خصوصاً بعد ريفريش)، البروكر يرجّع كل الرسائل القديمة
    // المحفوظة — حتى اللي أنا نفسي أرسلتها أو حذفتها أو عدّلتها من قبل.
    // خلال هذي الفترة بس، ما نطلق أي تنبيه — بعدها نرجع نتنبّه عادي
    // بس على الشي اللي يوصل فعلاً جديد وأنت متصل.
    JUST_SYNCED = true;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(function () { JUST_SYNCED = false; }, 3000);
  });
  CLIENT.on('reconnect', function () { LINK = 'mid'; paint(); });
  CLIENT.on('close', function () { LINK = 'down'; paint(); });
  CLIENT.on('offline', function () { LINK = 'down'; paint(); });
  CLIENT.on('error', function () { LINK = 'down'; paint(); });

  /* لما تفتح غرفة فيها تاريخ طويل، البروكر يرجّع كل الرسائل المحفوظة
     دفعة وحدة خلال أجزاء من الثانية. لو رسمنا الشاشة كاملة مع كل
     رسالة توصل لحالها، الشاشة تتجمّد لحظة — وهذا بالضبط سبب التعليق
     اللي تشوفه. الحل: نجمع كل التحديثات اللي توصل بسرعة ونرسم مرة
     وحدة بعدها، بدل ما نرسم عشرات المرات خلال نفس الثانية. */
  var paintTimer = null;
  var dirtyMsgs = {}, dirtyGames = {};
  function paintSoon(msgHash, gameHash) {
    if (msgHash) dirtyMsgs[msgHash] = true;
    if (gameHash) dirtyGames[gameHash] = true;
    clearTimeout(paintTimer);
    paintTimer = setTimeout(function () {
      paintTimer = null;
      for (var h in dirtyMsgs) saveMsgs(h);
      for (var h2 in dirtyGames) saveGames(h2);
      dirtyMsgs = {}; dirtyGames = {};
      paint();
    }, 40);
  }

  CLIENT.on('message', function (topic, buf) {
    var parts = topic.split('/');           // NS / hash-أو-dir / kind / ...
    var raw = buf.toString();
    var data = null;
    try { data = raw ? JSON.parse(raw) : null; } catch (e) { return; }

    // موضوع دليل الحسابات له شكل مختلف: NS/acct/<username> — نعالجه هنا
    // ونطلع قبل أي شي يحتاج ME (ممكن نكون لسا بمنتصف التسجيل).
    if (parts[1] === 'acct') { resolveLookup(parts[2], data); return; }

    var hash = parts[1], kind = parts[2];
    if (!ME) return;   // رسالة غرفة وصلت قبل ما يخلص التسجيل — نتجاهلها بأمان

    if (kind === 'm') {
      if (!data || data.who === ME.id) return;   // صدى رسالتي أنا — مطبّقة محلياً أصلاً
      var list = MSGS[hash] = MSGS[hash] || [];
      var idx = -1;
      for (var mi = 0; mi < list.length; mi++) if (list[mi].id === data.id) { idx = mi; break; }
      if (idx >= 0) {
        list[idx] = data;   // تحديث رسالة موجودة (تعديل أو حذف وصل متأخر)
        paintSoon(hash, null);
      } else {
        list.push(data);
        list.sort(function (a, b) { return a.t - b.t; });
        paintSoon(hash, null);
        var nRoom = ROOMS.filter(function (rr) { return fnv(rr.code.trim().toLowerCase()) === hash; })[0];
        notifyNewMessage(nRoom ? nRoom.title : 'هلا شات', data.name, data.kind === 'image' ? '📷 صورة' : data.body);
      }
    } else if (kind === 'r') {
      if (data && data.by === ME.id) return;
      var mid = parts[3];
      var list2 = MSGS[hash] || [];
      for (var i = 0; i < list2.length; i++) if (list2[i].id === mid) { list2[i].felt = (data && data.felt) || {}; break; }
      paintSoon(hash, null);
    } else if (kind === 'g') {
      if (data && data.by === ME.id) return;
      if (data) { GAMES[data.id] = data; paintSoon(null, hash); }
    } else if (kind === 't') {
      if (!data || data.who === ME.id) return;   // صدى كتابتي أنا
      TAPS[hash] = TAPS[hash] || {};
      if (data.on) TAPS[hash][data.who] = { n: data.name, t: Date.now() };
      else delete TAPS[hash][data.who];
      paintSoon();
    } else if (kind === 's') {
      var reader = parts[3];
      if (!data || reader === ME.id) return;
      PEER_SEEN[hash] = PEER_SEEN[hash] || {};
      PEER_SEEN[hash][reader] = data.at;
      paintSoon();
    } else if (kind === 'p') {
      var who2 = parts[3];
      if (!data || who2 === ME.id) return;
      PRESENCE[hash] = PRESENCE[hash] || {};
      PRESENCE[hash][who2] = { at: data.at, name: data.name };
      paintSoon();
    } else if (kind === 'meta') {
      if (!data || !data.title) return;
      var room = ROOMS.filter(function (rr) { return fnv(rr.code.trim().toLowerCase()) === hash; })[0];
      if (room && room.title !== data.title) { room.title = data.title; saveRooms(ROOMS); paintSoon(); }
    }
  });
}

/* ---------- عمليات الغرف ---------- */
function joinRoom(code, title, kind, publishTitle) {
  code = String(code || '').trim();
  if (!code) return null;
  var exists = ROOMS.filter(function (r) { return r.code === code; })[0];
  if (!exists) {
    exists = { code: code, title: title || code, kind: kind || 'group' };
    ROOMS.unshift(exists);
    saveRooms(ROOMS);
  } else if (title && title.trim() && title.trim() !== exists.title) {
    exists.title = title.trim();
    saveRooms(ROOMS);
  }
  subRoom(exists);
  pingPresence(exists.code);   // نعلن حضورنا فوراً بدل ما ننتظر أول نبضة دورية
  // اسم المجموعة يتزامن تلقائياً بين كل الأعضاء: بس اللي ينشئها فعلياً
  // ينشر اسمها كرسالة محفوظة (مو أي أحد ينضم لها، حتى لو أول مرة يشوفها
  // من جهازه هو) — غير كذا كل عضو جديد يمسح اسم اللي قبله بالغلط.
  if (publishTitle && title && title.trim()) {
    var hash = fnv(code.trim().toLowerCase());
    safePublish(NS + '/' + hash + '/meta', JSON.stringify({ title: title.trim() }), { qos: 1, retain: true });
  }
  return exists;
}

// إضافة صديق باسم المستخدم: نلقى حسابه بالدليل، ونشتق رمز غرفة ثابت

function addFriendByUsername(username, onResult) {
  username = String(username || '').trim().toLowerCase();
  if (!USERNAME_RE.test(username)) { onResult({ error: 'اكتب اسم مستخدم صحيح' }); return; }
  if (!ME) { onResult({ error: 'صار خطأ، حدّث الصفحة' }); return; }
  if (username === ME.username) { onResult({ error: 'هذا حسابك أنت' }); return; }
  lookupAccount(username, 1800, function (data) {
    if (!data) { onResult({ error: 'ما فيه حساب بهذا الاسم — تأكد إنه صحيح وإن صاحبه سجّل قبل' }); return; }
    var code = directCode(ME.username, username);
    var room = joinRoom(code, data.name, 'direct');
    room.avatar = data.avatar || null;
    room.friendUser = username;
    saveRooms(ROOMS);
    onResult({ room: room });
  });
}
function leaveRoom(code) {
  ROOMS = ROOMS.filter(function (r) { return r.code !== code; });
  saveRooms(ROOMS);
  var hash = fnv(code.trim().toLowerCase());
  if (CLIENT) CLIENT.unsubscribe(NS + '/' + hash + '/#');
  delete SUBBED[hash]; delete MSGS[hash]; delete TAPS[hash]; delete PEER_SEEN[hash]; delete PRESENCE[hash];
  for (var id in GAMES) if (GAMES[id].r === hash) delete GAMES[id];   // الألعاب مفهرسة بمعرّفها لا برمز الغرفة
  box.set('hala.msgs.' + hash, '[]'); box.set('hala.games.' + hash, '{}');
}

  var w = words[Math.floor(Math.random() * words.length)];

// نصغّر أي صورة دردشة قبل الإرسال — لازم تصغر كفاية عشان تعبر حد
// حجم الرسالة (١٢٨ك بالسيرفر)، فنقلل الجودة تدريجياً لين تصير مناسبة.
function prepareImageForChat(file, cb) {
  var reader = new FileReader();
  reader.onload = function () {
    var img = new Image();
    img.onload = function () {
      try {
        var maxDim = 720;
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width * scale)), h = Math.max(1, Math.round(img.height * scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);
        var quality = 0.72;
        var dataUrl = canvas.toDataURL('image/jpeg', quality);
        while (dataUrl.length > 130000 && quality > 0.25) {
          quality -= 0.12;
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        if (dataUrl.length > 150000) { cb(null, 'الصورة كبيرة جداً حتى بعد الضغط، جرّب صورة ثانية'); return; }
        cb(dataUrl, null);
      } catch (e) { cb(null, 'ما قدرنا نجهّز الصورة'); }
    };
    img.onerror = function () { cb(null, 'ما قدرنا نفتح الصورة'); };
    img.src = reader.result;
  };
  reader.onerror = function () { cb(null, 'ما قدرنا نقرأ الملف'); };
  reader.readAsDataURL(file);
}

var ROWS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
function judge(b) {
  for (var i = 0; i < ROWS.length; i++) { var w = ROWS[i];
    if (b[w[0]] !== '.' && b[w[0]] === b[w[1]] && b[w[1]] === b[w[2]]) return b[w[0]]; }
  return b.indexOf('.') >= 0 ? null : 'tie';
}
function drop(code, gid, i) {
  var g = GAMES[gid];
  if (!g || g.over) return;
  if (!g.o && ME.id !== g.x) { g.o = ME.id; g.on_ = ME.name; }
  var s = ME.id === g.x ? 'X' : (ME.id === g.o ? 'O' : null);
  if (!s || s !== g.turn) return;
  var b = g.b.split('');
  if (b[i] !== '.') return;
  b[i] = s; g.b = b.join('');
  var v = judge(g.b);
  g.turn = s === 'X' ? 'O' : 'X';
  if (v) { g.over = true; g.won = v; }

  var hash = roomTopic(code).split('/')[1];

function N(tag, attr, kids) {
  var n = document.createElement(tag);
  attr = attr || {};
  for (var k in attr) {
    var v = attr[k];
    if (v === null || v === undefined || v === false) continue;
    if (k === 'k') n.className = v;
    else if (k === 'txt') n.textContent = v;
    else if (k === 'sty') n.setAttribute('style', v);
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  (kids || []).forEach(function (c) { if (c) n.appendChild(c); });
  return n;
}

function copyText(t) {
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).catch(function () {});
}

function stream(code) {
  var f = feedOf(code);
  var wrap = N('div', { k: 'feed' });
  if (!f.length) {
    wrap.appendChild(N('div', { k: 'nothing', txt: LINK === 'up' ? 'ما فيه رسائل بعد.\nاكتب أول وحدة تحت.' : 'نتصل بشبكة الرسائل…' }));
    return wrap;
  }
  var day = '', who = null, when = 0;
  f.forEach(function (m) {
    var d = dayName(m.t), fresh = d !== day;
    if (fresh) { day = d; wrap.appendChild(N('div', { k: 'sep', txt: d })); who = null; }
    var head = fresh || m.who !== who || (m.t - when) > 18e4;
    wrap.appendChild(note(m, code, head));
    who = m.who; when = m.t;
  });
  return wrap;
}

function note(m, code, head) {
  var me = m.who === ME.id, kids = [];
  if (head && !me) kids.push(N('div', { k: 'by', txt: m.name, sty: 'color:' + (m.hue || '#8696A0') }));

  if (m.kind === 'play') kids.push(gameCard(m.gid, code));

  if (m.deleted) {
    var delBody = N('div', { k: 'txt', sty: 'color:var(--dim);font-style:italic;display:flex;align-items:center;gap:6px' },
      [ic('trash', 14), document.createTextNode('تم حذف هذي الرسالة')]);
    delBody.appendChild(N('span', { k: 'gap' }));
    kids.push(delBody);
  } else if (m.kind === 'image') {
    kids.push(N('img', { src: m.img, alt: '', sty: 'max-width:240px;max-height:320px;border-radius:10px;display:block;object-fit:cover' }));
    if (m.body) {
      var capBody = N('div', { k: 'txt', sty: 'margin-top:5px' });
      capBody.appendChild(document.createTextNode(m.body));
      capBody.appendChild(N('span', { k: 'gap' }));
      kids.push(capBody);
    }
  } else {
    var body = N('div', { k: 'txt' });
    body.appendChild(document.createTextNode(m.kind === 'play' ? 'إكس-أو' : m.body));
    if (m.edited) body.appendChild(N('span', { sty: 'color:var(--dim);font-size:11.5px', txt: ' (معدّلة)' }));
    body.appendChild(N('span', { k: 'gap' }));
    kids.push(body);
  }

  var st = [];
  if (m.open && m.open > Date.now()) {
    st.push(ic('time', 14, 'soon'));
    st.push(N('span', { txt: hhmm(m.open), sty: 'color:var(--warn)' }));
  } else {
    st.push(N('span', { txt: hhmm(m.t) }));
    if (me) st.push(ic(read(code, m) ? 'ok2' : 'ok', 15, read(code, m) ? 'ok2' : null));
  }
  kids.push(N('span', { k: 'stamp' }, st));

  var es = Object.keys(m.felt || {});
  if (es.length) {
    kids.push(N('div', { k: 'rx' }, es.map(function (e) {
      var who = m.felt[e];
      return N('button', { k: who.indexOf(ME.id) >= 0 ? 'on' : '',
        onclick: function (ev) { ev.stopPropagation(); feel(code, m.id, e); paint(); } },
        [N('span', { txt: e }), who.length > 1 ? N('span', { k: 'c', txt: String(who.length) }) : null]);
    })));
  }

  if (m.kind !== 'play' && !m.deleted) {
    kids.push(N('button', { k: 'pull', title: 'خيارات', 'aria-label': 'خيارات',
      onclick: function (ev) { ev.stopPropagation(); V.emos = V.emos === m.id ? null : m.id; paint(); } }, [ic('down', 18)]));
    if (V.emos === m.id) {
      var panel = ['👍','❤️','😂','😮','😢','🙏'].map(function (e) {
        var on = (m.felt && m.felt[e] || []).indexOf(ME.id) >= 0;
        return N('button', { k: on ? 'on' : '', txt: e, onclick: function () { feel(code, m.id, e); V.emos = null; paint(); } });
      });
      if (me && m.kind !== 'image') {
        panel.push(N('button', { title: 'تعديل', 'aria-label': 'تعديل', onclick: function () {
          V.editingMsg = m.id; V.note = m.body; V.emos = null; paint();
        } }, [ic('pen', 15)]));
      }
      if (me) {
        panel.push(N('button', { title: 'حذف', 'aria-label': 'حذف', onclick: function () {
          if (confirm('تحذف هذي الرسالة؟')) deleteMsg(code, m.id);
          V.emos = null; paint();
        } }, [ic('trash', 15)]));
      }
      kids.push(N('div', { k: 'emos', onclick: function (e) { e.stopPropagation(); } }, panel));
    }
  }

  // نعطي حركة "الظهور" لأول مرة بس — لو أعطيناها لكل رسالة بكل إعادة
  // رسم (يصير كثير: رسالة جديدة، نبضة كتابة، تحديث حضور...)، كل
  // الفقاعات القديمة كانت تهتز من جديد كل مرة، وهذا كان مزعج فعلاً.
  var isFresh = !ANIMATED_MSGS[m.id];
  ANIMATED_MSGS[m.id] = true;
  var b = N('div', { k: 'bub' + (isFresh ? ' bub-in' : '') + (head ? ' tip-l' : '') }, kids);
  return N('div', { k: 'line' + (me ? ' me' : '') + (head ? ' fresh' : '') + (es.length ? ' rxd' : '') }, [b]);
}

function gameCard(gid, code) {
  var g = GAMES[gid];
  if (!g) return N('div', { k: 'play', txt: 'جاري تحميل اللوحة…' });
  var s = ME.id === g.x ? 'X' : (ME.id === g.o ? 'O' : null);
  var turn = !g.over && (s === g.turn || (!g.o && ME.id !== g.x));
  var word = g.over ? (g.won === 'tie' ? 'تعادل' : 'فاز ' + g.won)
    : (!g.o ? 'اضغط أي مربع وتدخل اللعبة' : (turn ? 'دورك' : 'ننتظر الطرف الثاني'));
  return N('div', { k: 'play' }, [
    N('div', { k: 'play-h' }, [ic('grid', 15), N('span', { txt: 'إكس-أو' })]),
    N('div', { k: 'net' }, g.b.split('').map(function (c, i) {
      return N('button', { k: 'sq' + (c === 'X' ? ' x' : c === 'O' ? ' o' : ''), txt: c === '.' ? '' : c,
        'aria-label': 'مربع ' + (i+1), disabled: (c !== '.' || g.over || !turn) ? 'disabled' : null,
        onclick: function () { drop(code, g.id, i); } });
    })),
    N('div', { k: 'play-s', txt: word })
  ]);
}

function tapRow(code) {
  var hash = fnv(code.trim().toLowerCase());
  var t = TAPS[hash] || {}, names = [];
  for (var id in t) {
    if (Date.now() - t[id].t > 3500) { delete t[id]; continue; }
    if (id !== ME.id) names.push(t[id].n);
  }
  if (!names.length) return N('div', { k: 'tap' });
  return N('div', { k: 'tap' }, [N('span', { k: 'blips' }, [N('i'),N('i'),N('i')]), N('span', { txt: names.join('، ') + ' يكتب' })]);
}

var beat = null;
var typingActive = false;
function pen(code) {
  var at = N('input', { type: 'datetime-local', 'data-slot': 'when', value: V.whenVal,
    oninput: function (e) { V.whenVal = e.target.value; } });
  var MSG_MAX = 4000;   // حد معقول جداً لأي رسالة نصية، يمنع لصق نص ضخم بالغلط
  var area = N('textarea', { rows: 1, placeholder: V.editingMsg ? 'عدّل رسالتك' : 'اكتب رسالة', 'data-slot': 'pen', maxlength: String(MSG_MAX),
    oninput: function (e) {
      V.note = e.target.value.slice(0, MSG_MAX);
      e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 112) + 'px';
      // نبلّغ "أكتب" مرة وحدة بس عند البداية، مو مع كل حرف —
      // إرسال حدث شبكة مع كل ضغطة كان يسبب تجمّد ملحوظ وقت الكتابة السريعة.
      if (!typingActive) { typingActive = true; typingPing(code, true); }
      clearTimeout(beat);
      beat = setTimeout(function () { typingActive = false; typingPing(code, false); }, 1700);
    },
    onkeydown: function (e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); fire(); } }
  });
  area.value = V.note;

  function fire() {
    var body = V.note.trim().slice(0, MSG_MAX);
    if (!body) return;
    if (V.editingMsg) {
      var editingId = V.editingMsg;
      V.editingMsg = null; V.note = '';
      editMsg(code, editingId, body);   // ينادي paint() بنفسه — رسمة وحدة تعكس التعديل ومسح الصندوق معاً
      return;
    }
    var open = (V.timed && V.whenVal) ? new Date(V.whenVal).getTime() : null;
    V.note = ''; V.timed = false; V.pad = false; V.whenVal = '';
    typingActive = false;
    clearTimeout(beat);
    typingPing(code, false);
    post(code, body, open);   // ينادي paint() بنفسه — رسمة وحدة تعكس الرسالة الجديدة ومسح الصندوق معاً.
    // (قبل هذا الإصلاح، كنا ننادي paint() مرة ثانية هنا بعد post() — رسمتين
    // متتاليتين لكل رسالة كانت تمسح علامة "جديدة" قبل ما تظهر، وهذا كان
    // يسبب إعادة رسم الفقاعات القديمة بلا داعي = الاهتزاز المزعج.)
  }

  var imgInput = N('input', { type: 'file', accept: 'image/*', sty: 'display:none',
    onchange: function (e) {
      var f = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!f) return;
      V.imgBusy = true; paint();
      prepareImageForChat(f, function (dataUrl, err) {
        V.imgBusy = false;
        if (err) { V.imgErr = err; paint(); setTimeout(function () { V.imgErr = ''; paint(); }, 3500); return; }
        postImage(code, dataUrl, '');
      });
    } });

  var rows = [];
  if (V.imgErr) rows.push(N('div', { k: 'err', sty: 'margin:0 0 6px', txt: V.imgErr }));
  if (V.editingMsg) {
    rows.push(N('div', { k: 'clock-row' }, [ic('pen', 16), N('span', { txt: 'تعديل رسالة' }),
      N('button', { k: 'gen', txt: 'إلغاء', onclick: function () { V.editingMsg = null; V.note = ''; paint(); } })]));
  }
  if (V.pad) {
    rows.push(N('div', { k: 'pad-row' }, ['😀','😂','🥲','😍','😎','🤔','👍','🙏','🔥','❤️','🎉','💯','😴','🤝','👏','🌙','☕','⚽'].map(function (e) {
      return N('button', { txt: e, onclick: function () { V.note += e; paint(); } });
    })));
  }
  if (V.timed) {
    rows.push(N('div', { k: 'clock-row' }, [ic('time', 17), N('span', { txt: 'تنفتح الرسالة:' }), at,
      N('span', { txt: 'تنبيه: أي أحد بالشبكة يقدر يشوف بيانات الرسالة وقت إرسالها، بس الشاشة تخفيها عنه لين وقتها.' })]));
  }
  rows.push(N('div', { k: 'write-row' }, [
    N('button', { k: 'ico' + (V.pad ? ' act' : ''), title: 'إيموجي', 'aria-label': 'إيموجي', onclick: function () { V.pad = !V.pad; paint(); } }, [ic('face', 23)]),
    N('button', { k: 'ico', title: V.imgBusy ? 'جاري التجهيز…' : 'إرسال صورة', 'aria-label': 'إرسال صورة', disabled: V.imgBusy ? 'disabled' : null,
      onclick: function () { imgInput.click(); } }, [ic('cam', 22)]),
    imgInput,
    N('button', { k: 'ico' + (V.timed ? ' act' : ''), title: 'رسالة موقوتة', 'aria-label': 'رسالة موقوتة', onclick: function () { V.timed = !V.timed; paint(); } }, [ic('time', 22)]),
    N('button', { k: 'ico', title: 'ابدأ لعبة إكس-أو', 'aria-label': 'لعبة إكس-أو', onclick: function () { startGame(code); } }, [ic('grid', 22)]),
    N('div', { k: 'box' }, [area]),
    N('button', { k: 'go', title: 'إرسال', 'aria-label': 'إرسال', onclick: fire }, [ic('plane', 21)])
  ]));
  return N('div', { k: 'write' }, rows);
}

/* ---------- نافذة إنشاء/انضمام لغرفة ---------- */

  var TITLE_MAX = 60, CODE_MAX = 80;
  function shut() { V.sheet = false; paint(); }

  var body = [];
  if (V.dtab === 'friend') {

    if (V.fidErr) body.push(N('div', { k: 'err', sty: 'margin:0 16px 14px', txt: V.fidErr }));

  } else if (V.dtab === 'newgroup') {
    body.push(N('div', { k: 'txt-fld' }, [
      N('label', { k: 'fld-lab', txt: 'اسم المجموعة' }),
      N('input', { value: V.title, 'data-slot': 'gt', placeholder: 'مثلاً: شلة المدرسة', maxlength: String(TITLE_MAX),
        oninput: function (e) { V.title = e.target.value; } })
    ]));
    body.push(N('div', { k: 'txt-fld' }, [
      N('div', { k: 'fld-lab row' }, [
        N('span', { txt: 'رمز الدعوة' }),
        N('button', { k: 'gen', txt: 'رمز جديد', onclick: function () { V.code = randomCode(); paint(); } })
      ]),
      N('div', { k: 'code-box' }, [
        N('b', { txt: V.code }),
        N('button', { title: 'نسخ', 'aria-label': 'نسخ الرمز', onclick: function () { copyText(V.code); } }, [ic('copy', 17)])
      ])
    ]));
    body.push(N('p', { k: 'hint-line', txt: 'أرسل هذا الرمز لأعضاء المجموعة، وخلّهم يضغطون "انضم لمجموعة" ويكتبونه.' }));
  } else {
    body.push(N('div', { k: 'txt-fld' }, [
      N('label', { k: 'fld-lab', txt: 'رمز الدعوة اللي أرسلوه لك' }),
      N('input', { value: V.code, 'data-slot': 'gc', dir: 'ltr', placeholder: 'الصق الرمز هنا', maxlength: String(CODE_MAX),
        oninput: function (e) { V.code = e.target.value; },
        onkeydown: function (e) { if (e.key === 'Enter') goGroup(); } })
    ]));
    body.push(N('div', { k: 'txt-fld' }, [
      N('label', { k: 'fld-lab', txt: 'اسم المجموعة (اختياري)' }),
      N('input', { value: V.title, 'data-slot': 'gt', placeholder: 'مثلاً: شلة المدرسة', maxlength: String(TITLE_MAX),
        oninput: function (e) { V.title = e.target.value; } })
    ]));
  }

  var goFn = V.dtab === 'friend' ? goFriend : (V.dtab === 'newgroup' ? goGroup : goGroup);
  var btnLabel = V.dtab === 'friend' ? (V.busy ? 'جاري البحث…' : 'أضف الصديق') : (V.dtab === 'newgroup' ? 'إنشاء ودخول' : 'انضم للمجموعة');

  var kids = [
    N('div', { k: 'sheet-h' }, [
      N('button', { k: 'ico', title: 'إغلاق', 'aria-label': 'إغلاق', onclick: shut }, [ic('shut', 21)]),
      N('b', { txt: 'دردشة جديدة' })
    ]),
    N('div', { k: 'seg' }, [
      N('button', { k: V.dtab === 'friend' ? 'on' : '', txt: 'صديق جديد',
        onclick: function () { V.dtab = 'friend'; V.code = ''; V.fidErr = ''; paint(); } }),
      N('button', { k: V.dtab === 'newgroup' ? 'on' : '', txt: 'إنشاء مجموعة',
        onclick: function () { V.dtab = 'newgroup'; V.code = randomCode(); V.title = ''; paint(); } }),
      N('button', { k: V.dtab === 'joingroup' ? 'on' : '', txt: 'انضم لمجموعة',
        onclick: function () { V.dtab = 'joingroup'; V.code = ''; V.title = ''; paint(); } })
    ]),
    N('div', { k: 'sheet-b' }, body),
    N('div', { k: 'sheet-f' }, [N('button', { k: 'btn', txt: btnLabel, disabled: V.busy ? 'disabled' : null, onclick: goFn })])
  ];
  return N('div', { k: 'veil', onclick: shut }, [N('div', { k: 'sheet', onclick: function (e) { e.stopPropagation(); } }, kids)]);
}

/* ---------- نافذة تعديل البروفايل ---------- */
function profileDialog() {
  var NAME_MAX = 30;
  function shut() { V.profileSheet = false; paint(); }
  function save() {
    var v = V.editName.trim().slice(0, NAME_MAX);
    if (v.length < 2) return;
    updateProfile(v, V.editAvatar);
    V.profileSheet = false; paint();
  }
  var fileInput = N('input', { type: 'file', accept: 'image/*', sty: 'display:none',
    onchange: function (e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      shrinkImage(f, 96, function (dataUrl) { V.editAvatar = dataUrl; paint(); });
    } });
  var pic = N('button', { k: 'pick-avatar', title: 'غيّر الصورة', 'aria-label': 'غيّر الصورة',
    onclick: function () { fileInput.click(); } },
    [avatar(V.editName.slice(0, 1), ME.hue, 'l', false, V.editAvatar), N('span', { k: 'cam-badge' }, [ic('cam', 12)])]);

  var kids = [
    N('div', { k: 'sheet-h' }, [
      N('button', { k: 'ico', title: 'إغلاق', 'aria-label': 'إغلاق', onclick: shut }, [ic('shut', 21)]),
      N('b', { txt: 'بروفايلك' })
    ]),
    N('div', { k: 'sheet-b' }, [
      N('div', { k: 'pick-row' }, [pic, fileInput]),
      N('div', { k: 'txt-fld' }, [
        N('label', { k: 'fld-lab', txt: 'اسمك' }),
        N('input', { value: V.editName, 'data-slot': 'pn', maxlength: String(NAME_MAX),
          oninput: function (e) { V.editName = e.target.value; } })
      ]),
      N('div', { k: 'txt-fld' }, [
        N('label', { k: 'fld-lab', txt: 'اسم المستخدم حقّك (يضيفك فيه أصحابك)' }),
        N('div', { k: 'code-box' }, [
          N('b', { txt: '@' + ME.username }),
          N('button', { title: 'نسخ', 'aria-label': 'نسخ اسم المستخدم', onclick: function () { copyText(ME.username); } }, [ic('copy', 17)])
        ])
      ])
    ]),
    N('div', { k: 'sheet-f' }, [N('button', { k: 'btn', txt: 'حفظ', onclick: save })])
  ];
  return N('div', { k: 'veil', onclick: shut }, [N('div', { k: 'sheet', onclick: function (e) { e.stopPropagation(); } }, kids)]);
}

/* ---------- نافذة الإعدادات ---------- */
/* ---------- نافذة "قريباً" — بصراحة، ميزة المكالمات مو موجودة بعد ---------- */
function soonDialog() {
  function shut() { V.soonSheet = false; paint(); }
  var kids = [
    N('div', { k: 'sheet-h' }, [
      N('button', { k: 'ico', title: 'إغلاق', 'aria-label': 'إغلاق', onclick: shut }, [ic('shut', 21)]),
      N('b', { txt: 'الاتصالات' })
    ]),
    N('div', { k: 'sheet-b', sty: 'display:flex;flex-direction:column;align-items:center;gap:14px;padding:36px 24px;text-align:center' }, [
      ic('phone', 46),
      N('p', { sty: 'margin:0;color:var(--dim);font-size:13.5px;line-height:1.7', txt: 'المكالمات الصوتية والمرئية قريباً — بعدها إن شاء الله.' })
    ])
  ];
  return N('div', { k: 'veil', onclick: shut }, [N('div', { k: 'sheet', onclick: function (e) { e.stopPropagation(); } }, kids)]);
}

function settingsDialog() {
  function shut() { V.settingsSheet = false; paint(); }
  var kids = [
    N('div', { k: 'sheet-h' }, [
      N('button', { k: 'ico', title: 'إغلاق', 'aria-label': 'إغلاق', onclick: shut }, [ic('shut', 21)]),
      N('b', { txt: 'الإعدادات' })
    ]),
    N('div', { k: 'sheet-b' }, [
      N('button', { k: 'set-row', onclick: function () { V.settingsSheet = false; V.profileSheet = true; V.editName = ME.name; V.editAvatar = ME.avatar || null; paint(); } },
        [ic('one', 20), N('span', { txt: 'البروفايل — الاسم والصورة والرقم' })]),
      N('button', { k: 'set-row', onclick: function () { copyText(ME.username); } },
        [ic('hash', 20), N('span', { txt: 'نسخ اسم المستخدم (@' + ME.username + ')' })]),
      N('button', { k: 'set-row', onclick: toggleNotif },
        [ic('bell', 20), N('span', { sty: 'flex:1', txt: 'تنبيهات المتصفح' }), N('span', { k: 'mark' + (V.notifOn ? ' on' : ''), sty: 'display:grid' }, V.notifOn ? [ic('ok', 13)] : [])]),
      N('div', { k: 'set-note' }, [ic('note', 15), N('span', { txt: 'حسابك محفوظ باسم المستخدم والرمز السري — تقدر تسجّل دخول فيه من أي جهاز، حتى لو مسحت بيانات المتصفح.' })]),
      N('button', { k: 'set-row bad', onclick: function () { logout(); paint(); } },
        [ic('out', 20), N('span', { txt: 'تسجيل الخروج' })])
    ])
  ];
  return N('div', { k: 'veil', onclick: shut }, [N('div', { k: 'sheet', onclick: function (e) { e.stopPropagation(); } }, kids)]);
}

/* ---------- إغلاق القوائم ---------- */
document.addEventListener('click', function () { if (V.emos !== null || V.menu) { V.emos = null; V.menu = false; paint(); } });
document.addEventListener('keydown', function (e) {
  if (e.key !== 'Escape') return;
  if (V.emos !== null || V.menu) { V.emos = null; V.menu = false; paint(); }
  else if (V.sheet) { V.sheet = false; paint(); }
  else if (V.open) { V.open = null; paint(); }
});

/* ---------- نبضات محلية: موقوتة + تنظيف مؤشرات الكتابة القديمة ---------- */
var lastTapSig = '';
setInterval(function () {
  if (!ME) return;
  var t = Date.now(), due = false;
  for (var h in MSGS) for (var i = 0; i < MSGS[h].length; i++) {
    var m = MSGS[h][i];
    if (m.open && m.open <= t && m.open > t - 1100) { due = true; break; }
  }
  var live = [];
  if (V.open) { var hh = fnv(V.open.trim().toLowerCase()); var tp = TAPS[hh] || {};
    for (var id in tp) if (t - tp[id].t <= 3500) live.push(id); }
  var sig = live.sort().join(',');
  if (due || sig !== lastTapSig) { lastTapSig = sig; paint(); }
}, 900);

setInterval(function () {
  if (ME && V.open && document.hasFocus()) markSeen(V.open);
}, 1500);

// نسجّل عامل الخدمة (شرط تقني عشان المتصفح ومولّدات APK يعتبرون
// الصفحة تطبيق ويب تقدمي قابل للتثبيت). لو فشل لأي سبب، نتجاهله
// بهدوء — التطبيق يشتغل عادي بدونه، بس ما يصير "قابل للتثبيت".
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}

paint();
</script>
