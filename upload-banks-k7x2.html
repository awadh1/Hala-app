const qn=s=>String(s).normalize('NFKD').replace(/[\u064B-\u065F\u0670\u0640]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ').trim();
const log=t=>{document.getElementById('log').textContent+=t+'\n'};
const mine=l=>/^(العلوم|الدراسات الاجتماعية) · /.test(l||'');
const part=l=>{const p=(l||'').split(' · ');return p.length>1?p.slice(1).join(' · '):l||''};
document.getElementById('go').onclick=async()=>{
 const base=document.getElementById('url').value.replace(/\/$/,''),key=document.getElementById('key').value.replace(/\s+/g,'');
 if(!key){log('اكتب المفتاح');return}
 log('الموقع ممكن ياخذ دقيقة يصحى...');
 for(const sub of Object.keys(DATA)){
  try{
   const r=await fetch(base+'/quiz?subject='+sub+'&t='+Date.now());const all=await r.json();
   const old=all.filter(i=>!mine(i.ln));
   log(sub+': القديم '+old.length+' (شلت '+(all.length-old.length)+' من رفعتي السابقة)');
   const seen=new Set(old.map(i=>qn(i.q)));
   const lessons={};old.forEach(i=>{if(!i.ln)return;const o=lessons[i.ln]||(lessons[i.ln]={ln:i.ln,l:i.l==null?99:i.l});if((i.l==null?99:i.l)<o.l)o.l=i.l});
   let mx=old.reduce((m,i)=>Math.max(m,i.l||0),0);const map={};
   const G={};
   for(const g of (RULES[sub]||[])){
    const kws=g.kw.split('|');
    const hit=Object.values(lessons).filter(o=>kws.some(k=>part(o.ln).includes(k))).sort((a,b)=>a.l-b.l);
    const info={g,unit:hit.length?hit[0].ln.split(' · ')[0]:null,base:hit.length?hit[0].l:(mx+=10),lns:new Set(hit.map(o=>o.ln))};
    G[g.id]=info;
    old.forEach(i=>{if(!info.lns.has(i.ln))return;
     const t=i.q+' '+(i.a||'');let nm=g.subs[0];
     for(const [n,rx] of g.rules){if(new RegExp(rx).test(t)){nm=n;break}}
     i.ln=info.unit+' · '+nm;i.l=info.base+g.subs.indexOf(nm)/100});
    if(hit.length)log('  '+g.id+': قسمت '+old.filter(i=>(i.ln||'').startsWith(info.unit+' · ')&&g.subs.includes(part(i.ln))).length+' سؤال قديم على '+g.subs.length+' دروس');
   }
   Object.values(lessons).forEach(()=>{});
   const resolve=it=>{
    if(map[it.ln])return map[it.ln];
    const kws=(it.kw||'').split('|').filter(Boolean);
    const hit=Object.values(lessons).filter(o=>kws.some(k=>part(o.ln).includes(k))).sort((a,b)=>a.l-b.l)[0];
    mx+=10;return map[it.ln]=hit?{ln:hit.ln,l:hit.l,m:1}:{ln:it.ln,l:mx,m:0}};
   const add=[];
   for(const it of DATA[sub]){
    const k=qn(it.q);if(it.t!=='match'&&seen.has(k))continue;
    let R;
    if(it.gk&&G[it.gk]){const f=G[it.gk];const nm=it.ln.split(' · ').pop();R={ln:(f.unit||it.ln.split(' · ')[0])+' · '+nm,l:f.base+it.gi/100}}
    else R=resolve(it);
    const x={...it};delete x.kw;delete x.gk;delete x.gi;x.ln=R.ln;x.l=R.l;add.push(x)}
   Object.keys(map).forEach(k=>log('  '+k.split(' · ').pop()+' ← '+(map[k].m?'وضعتها تحت: '+map[k].ln:'درس جديد')));
   const items=old.concat(add);
   const p=await fetch(base+'/quiz/add',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({key,subject:sub,items})});
   const j=await p.json();
   log(sub+': '+old.length+' قديم + '+add.length+' جديد = '+(j.n??JSON.stringify(j)));
  }catch(e){log(sub+': فشل '+e.message)}
 }
};
</script></html>
