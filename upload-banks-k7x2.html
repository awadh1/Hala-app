const isDup=(x,y)=>{if(x.t!==y.t)return false;
 if(x.q===y.q)return x.t==='match'?x.a===y.a:(x.t==='open'||x.t==='why'||x.a===y.a||true);
 if(x.t==='match')return false;
 const j=jac(x.w,y.w);
 if(x.t==='open'||x.t==='why')return j>=0.9;
 return j>=0.85&&x.a===y.a};
const dedupe=(list,pool)=>{const kept=pool||[];const out=[];let d=0;
 for(const it of list){const s=mkSig(it);let dup=false;for(const k of kept){if(isDup(s,k)){dup=true;break}}
  if(dup){d++;continue}kept.push(s);out.push(it)}
 return [out,d]};
const log=t=>{document.getElementById('log').textContent+=t+'\n'};
const mine=l=>/^(العلوم|الدراسات الاجتماعية) · /.test(l||'');
const part=l=>{const p=(l||'').split(' · ');return p.length>1?p.slice(1).join(' · '):l||''};
document.getElementById('go').onclick=async()=>{
 const base=document.getElementById('url').value.replace(/\/$/,''),key=document.getElementById('key').value.replace(/\s+/g,'');
 if(!key){log('اكتب المفتاح');return}
 log('الموقع ممكن ياخذ دقيقة يصحى...');
 for(const sub of Object.keys(DATA)){
  try{
   let before='?';try{const r=await fetch(base+'/quiz?subject='+sub+'&t='+Date.now());before=(await r.json()).length}catch(e){}
   const items=DATA[sub].map(it=>{const x={...it};delete x.kw;delete x.gk;delete x.gi;return x});
   const body=JSON.stringify({key,subject:sub,items});
   const p=await fetch(base+'/quiz/add',{method:'POST',headers:{'content-type':'application/json'},body:body});
   const j=await p.json();
   log(sub+': كان '+before+' ← صار '+(j.n??JSON.stringify(j)));
  }catch(e){log(sub+': فشل '+e.message+' — انتظر دقيقتين وجرب مرة ثانية')}
 }
 log('خلصت. انتظر 5 دقايق وافتح الموقع.');
};
