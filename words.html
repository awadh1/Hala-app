<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F3F0">
<title>كلماتي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3F0;--card:#FFFFFF;--ink:#17212B;--mut:#5D6975;--line:#D3D9DE;
  --bd:#17212B;--shc:#17212B;--acc:#1F4FD8;--acct:#FFFFFF;
  --ok:#1B7A4B;--okbg:#E3F3EA;--bad:#B8392D;--badbg:#F8E6E3;--near:#8A5A00;--nearbg:#FBF0D5;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12171C;--card:#1B232B;--ink:#E8EDF1;--mut:#9AA7B3;--line:#2E3943;
    --bd:#55636F;--shc:#000;--acc:#7C97FF;--acct:#0C1230;
    --ok:#4CC38A;--okbg:#17352A;--bad:#F07A6E;--badbg:#3A2320;--near:#E8B64A;--nearbg:#3A2F15;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;min-height:100vh;padding-bottom:84px}
.en{direction:ltr;unicode-bidi:isolate;font-family:"Source Serif 4",Georgia,serif;display:inline-block}
.en.blk{display:block;text-align:left}
main{max-width:560px;margin:0 auto;padding:20px 16px}
h1{font-size:26px;margin:0 0 4px;font-weight:600}
h2{font-size:18px;margin:24px 0 10px;font-weight:600}
.sub{color:var(--mut);font-size:14px;margin:0 0 18px}
.panel{background:var(--card);border:2px solid var(--bd);border-radius:6px;box-shadow:5px 5px 0 var(--shc);padding:18px}
.row{display:flex;gap:10px;align-items:center}
.row.sp{justify-content:space-between}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.stat{background:var(--card);border:1.5px solid var(--line);border-radius:6px;padding:10px 12px}
.stat b{display:block;font-size:24px;line-height:1.2;font-weight:600}
.stat span{font-size:13px;color:var(--mut)}
button,input,textarea,select{font:inherit;color:inherit}
.btn{appearance:none;border:2px solid var(--bd);background:var(--card);border-radius:6px;padding:11px 16px;font-weight:500;cursor:pointer;min-height:46px}
.btn.pri{background:var(--acc);color:var(--acct);border-color:var(--acc)}
.btn.blk{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible,input:focus-visible,textarea:focus-visible,.tab:focus-visible,.opt:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px}
.link{background:none;border:0;color:var(--acc);padding:6px 2px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.big{font-size:44px;font-weight:600;line-height:1.1;letter-spacing:-.01em}
.word{font-size:46px;font-weight:600;line-height:1.1;margin:6px 0 2px}
.pos{display:block;color:var(--mut);font-size:15px;font-style:italic}
.hd{direction:ltr;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.def{font-size:20px;line-height:1.45;margin:12px 0}
.exs{font-size:19px;line-height:1.5;margin:10px 0;color:var(--ink)}
.exs mark{background:none;color:var(--acc);font-weight:600;border-bottom:2px solid var(--acc)}
.blank{display:inline-block;border-bottom:2.5px solid var(--ink);height:1em;vertical-align:-2px;margin:0 3px}
.say{display:inline-flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;border:2px solid var(--bd);background:var(--card);cursor:pointer;flex:none}
.say svg{width:20px;height:20px;fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{appearance:none;text-align:left;direction:ltr;border:2px solid var(--line);background:var(--card);border-radius:6px;padding:12px 14px;font:600 20px "Source Serif 4",Georgia,serif;cursor:pointer;min-height:50px}
.opt:hover{border-color:var(--bd)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.ans{width:100%;direction:ltr;text-align:left;font:600 24px "Source Serif 4",Georgia,serif;padding:12px 14px;border:2px solid var(--bd);border-radius:6px;background:var(--card);margin-top:14px}
.fb{border-radius:6px;padding:12px 14px;margin-top:14px;font-weight:500}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.bad{background:var(--badbg);color:var(--bad)}
.fb.near{background:var(--nearbg);color:var(--near)}
.hint{color:var(--mut);font-size:15px;margin-top:10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc)}
.tabs{position:fixed;inset:auto 0 0 0;background:var(--card);border-top:2px solid var(--bd);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tab{flex:1;appearance:none;border:0;background:none;padding:14px 4px;font-weight:500;color:var(--mut);cursor:pointer;position:relative}
.tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"]::after{content:"";position:absolute;inset:auto 22% 0 22%;height:4px;background:var(--acc)}
textarea{width:100%;min-height:150px;direction:ltr;text-align:left;padding:12px;border:2px solid var(--bd);border-radius:6px;background:var(--card);font:400 17px/1.5 "Source Serif 4",Georgia,serif}
input[type=text],input[type=search],input[type=number]{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:6px;background:var(--card)}
label.f{display:block;font-weight:500;margin:14px 0 6px;font-size:15px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{appearance:none;border:1.5px solid var(--line);background:var(--card);border-radius:20px;padding:6px 14px;cursor:pointer;font:500 18px "Source Serif 4",Georgia,serif;direction:ltr}
.chip small{font:400 12px "IBM Plex Sans Arabic",sans-serif;color:var(--mut);margin-inline-start:6px}
.chip.on{border-color:var(--ok);background:var(--okbg)}
.list .it{direction:ltr;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.list .it:last-child{border:0}
.tag{font-size:12px;color:var(--mut)}
.chart{display:flex;gap:4px;align-items:flex-end;height:64px;margin-top:6px}
.chart i{flex:1;background:var(--acc);min-height:3px;border-radius:2px 2px 0 0;opacity:.85}
.chart i.z{background:var(--line);opacity:1}
.sheet{position:fixed;inset:0;background:rgba(10,14,18,.5);display:flex;align-items:flex-end;z-index:20}
.sheet>div{background:var(--bg);width:100%;max-width:560px;margin:0 auto;border-radius:12px 12px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;border-top:2px solid var(--bd)}
.note{font-size:14px;color:var(--mut)}
@media (prefers-reduced-motion:no-preference){.fb{animation:pop .18s ease-out}@keyframes pop{from{transform:translateY(4px);opacity:0}to{transform:none;opacity:1}}}
</style>

const RANK={};RANKS.forEach((w,i)=>{RANK[w]=i+1});
const BASE={};let BASE_IDS=[];
RAW.split('\n').forEach(l=>{const p=l.split('|');if(p.length<5)return;const id=p[0].trim().toLowerCase();
  BASE[id]={w:p[0].trim(),pos:p[1],def:p[2],ex:p[3],ar:p[4]};BASE_IDS.push(id);});
BASE_IDS.sort((a,b)=>(RANK[a]||99999)-(RANK[b]||99999)); // most frequent English words first

/* ---------- state ---------- */
const KEY='kalimati_v1';
const F=FSRS;const R=F.Rating;
const sched=F.fsrs(F.generatorParameters({request_retention:0.9,enable_fuzz:true}));
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function dayKey(d){d=d||new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function fresh(){return{v:1,st:{},custom:{},order:BASE_IDS.slice(),set:{perDay:10,skipTop:800,rate:0.85,dict:true},log:{},newDay:{d:'',n:0,bonus:0}}}
let S=(function(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j&&j.v===1){
  // keep new base words added in later versions
  j.order=BASE_IDS.slice();return j}}catch(e){}return fresh()})();
let memOnly=false;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){memOnly=true}}
function info(id){return S.custom[id]||BASE[id]}
function cardOf(id){const c=S.st[id].f;return Object.assign({},c,{due:new Date(c.due),last_review:c.last_review?new Date(c.last_review):undefined})}
function today(){const k=dayKey();if(S.newDay.d!==k)S.newDay={d:k,n:0,bonus:0};return S.newDay}
function allowance(){const t=today();return Math.max(0,S.set.perDay+t.bonus-t.n)}
function newPool(){const out=[];Object.keys(S.custom).forEach(id=>{if(!S.st[id])out.push(id)});
  for(const id of S.order){if(!S.st[id]&&BASE[id])out.push(id)}return out}
function dueIds(now){now=now||new Date();return Object.keys(S.st).filter(id=>new Date(S.st[id].f.due)<=now).sort((a,b)=>new Date(S.st[a].f.due)-new Date(S.st[b].f.due))}

/* ---------- speech ---------- */
let VOICE=null;
function pickVoice(){if(!('speechSynthesis' in window))return;const v=speechSynthesis.getVoices().filter(x=>/^en/i.test(x.lang));
  VOICE=v.find(x=>/en[-_]US/i.test(x.lang)&&/google|samantha|enhanced|premium|natural/i.test(x.name))||v.find(x=>/en[-_]US/i.test(x.lang))||v[0]||null}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function canSay(){return 'speechSynthesis' in window}
function say(t){if(!canSay())return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[{}]/g,''));u.lang='en-US';if(VOICE)u.voice=VOICE;u.rate=S.set.rate;speechSynthesis.speak(u)}catch(e){}}
const ICON='<svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
function sayBtn(txt,id){return `<button class="say" type="button" data-say="${esc(txt)}" aria-label="استمع" ${id?`id="${id}"`:''}>${ICON}</button>`}

/* ---------- helpers ---------- */
function lev(a,b){const m=a.length,n=b.length;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function formOf(i){const m=/\{([^}]+)\}/.exec(i.ex||'');return m?m[1]:i.w}
function exHTML(i,mode){ // mode: 'blank' | 'mark'
  if(!i.ex||!/\{/.test(i.ex))return'';
  let out='',last=0;const re=/\{([^}]+)\}/g;let m;
  while((m=re.exec(i.ex))){out+=esc(i.ex.slice(last,m.index));
    out+=mode==='blank'?`<span class="blank" style="width:${Math.max(3,m[1].length*.62)}em"></span>`:`<mark>${esc(m[1])}</mark>`;last=re.lastIndex}
  out+=esc(i.ex.slice(last));return `<span class="en blk exs">${out}</span>`}
function fmtDate(){return new Date().toLocaleDateString('ar-KW',{weekday:'long',day:'numeric',month:'long'})}
function stats(){
  const ids=Object.keys(S.st);let mature=0;ids.forEach(id=>{if(S.st[id].f.state===2&&S.st[id].f.stability>=21)mature++});
  let streak=0;const d=new Date();if(!(S.log[dayKey(d)]||{}).r)d.setDate(d.getDate()-1);
  while((S.log[dayKey(d)]||{}).r){streak++;d.setDate(d.getDate()-1)}
  return{total:ids.length,mature,streak}}

/* ---------- views ---------- */
let TAB='home',SESS=null;
function go(t){TAB=t;SESS=null;try{speechSynthesis.cancel()}catch(e){}render();window.scrollTo(0,0)}
function render(){
  document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-current',b.dataset.t===TAB?'page':'false'));
  if(SESS)return renderSession();
  ({home:viewHome,text:viewText,words:viewWords,set:viewSet})[TAB]()}

function viewHome(){
  const now=new Date(),due=dueIds(now).length,al=Math.min(allowance(),newPool().length),st=stats();
  const days=[];for(let i=13;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days.push((S.log[dayKey(d)]||{}).r||0)}
  const mx=Math.max(1,...days);
  $('#app').innerHTML=`
  <h1>كلماتي</h1><p class="sub">${fmtDate()}</p>
  <div class="panel">
    <div class="row sp"><div><div class="big">${due+al}</div><div class="note">بطاقة اليوم</div></div>
    <div class="note" style="text-align:left">${due} مراجعة<br>${al} كلمة جديدة</div></div>
    <button class="btn pri blk" id="go" style="margin-top:16px" ${due+al?'':'disabled'}>${due+al?'ابدأ':'خلصت اليوم'}</button>
    ${(!al&&newPool().length)?`<button class="btn blk" id="more" style="margin-top:10px">أبي 5 كلمات زيادة</button>`:''}
  </div>
  <div class="grid3">
    <div class="stat"><b>${st.total}</b><span>في التدريب</span></div>
    <div class="stat"><b>${st.mature}</b><span>ثابتة</span></div>
    <div class="stat"><b>${st.streak}</b><span>أيام متتالية</span></div>
  </div>
  <h2>آخر 14 يوم</h2>
  <div class="chart" aria-label="عدد المراجعات">${days.map(n=>`<i class="${n?'':'z'}" style="height:${n?Math.max(6,n/mx*100):5}%" title="${n}"></i>`).join('')}</div>
  <p class="note" style="margin-top:18px">«ثابتة» = الكلمة اللي جدولتها وصلت 21 يوم أو أكثر. الكلمات مرتبة من الأشيع في الإنجليزية إلى الأقل، وإذا قلت «أعرفها» وكتبتها صح ما تُحسب من كلماتك الجديدة اليوم، وتقدر تضيف كلماتك من أي نص في تبويب «أضف نص».${memOnly?'<br><b>تنبيه:</b> المتصفح ما يسمح بالحفظ، تقدمك ما راح يبقى.':''}</p>`;
  const g=$('#go');if(g)g.onclick=startSession;
  const m=$('#more');if(m)m.onclick=()=>{today().bonus+=5;save();render()}}

/* ---------- session ---------- */
function startSession(){
  const now=new Date();const Q=dueIds(now).map(id=>({id,k:'rev'}));
  newPool().slice(0,allowance()).forEach(id=>Q.push({id,k:'new'}));
  SESS={Q,cur:null,n:0,ok:0,bad:[],started:Date.now()};next()}
function next(){
  const S_=SESS;if(!S_.Q.length){ // look ahead: cards in learning due soon
    if(S_.held&&S_.held.length){S_.Q=S_.held.splice(0)}else return finish()}
  S_.applied=null;S_.counted=false;S_.rate=null;
  S_.cur=S_.Q.shift();S_.step=S_.cur.k==='new'?'intro':'test';S_.res=null;S_.hint=0;S_.t0=Date.now();
  if(S_.step==='test')prepTest();render();
  if(S_.step==='intro')setTimeout(()=>say(info(S_.cur.id).w),150);
  else if(S_.kind==='dict')setTimeout(()=>say(info(S_.cur.id).w),150)}
function prepTest(){
  const s=SESS,id=s.cur.id,c=S.st[id]?S.st[id].f:null;
  if(s.cur.known)s.kind='cloze';
  else if(c&&c.reps<2&&c.state!==2)s.kind='choice';
  else s.kind=(canSay()&&S.set.dict&&Math.random()<.35)?'dict':'cloze';
  if(s.kind==='choice'){
    const me=info(id);const pool=[...BASE_IDS,...Object.keys(S.custom)].filter(x=>x!==id);
    const same=shuffle(pool.filter(x=>info(x).pos===me.pos)),other=shuffle(pool.filter(x=>info(x).pos!==me.pos));
    s.opts=shuffle([id,...same.concat(other).slice(0,3)])}}

function renderSession(){
  const s=SESS,id=s.cur.id,i=info(id),left=s.Q.length+(s.held?s.held.length:0)+1;
  const head=`<div class="row sp" style="margin-bottom:14px"><span class="note">متبقي ${left}</span><button class="link" id="quit">إنهاء</button></div>`;
  let body='';
  if(s.step==='intro'){
    body=`<div class="panel"><div class="note">كلمة جديدة</div>
      <div class="hd"><div><div class="word en">${esc(i.w)}</div><div class="pos en">${esc(i.pos)}</div></div>${sayBtn(i.w)}</div>
      <div class="def en blk">${esc(i.def)}</div>${exHTML(i,'mark')}
      ${i.ex?`<div class="row" style="margin-top:6px">${sayBtn(i.ex)}<span class="note">الجملة</span></div>`:''}
      <details style="margin-top:14px"><summary class="note" style="cursor:pointer">التلميح بالعربي</summary><div style="margin-top:6px;font-size:18px">${esc(i.ar||'')}</div></details>
      <div class="row" style="margin-top:18px"><button class="btn pri" id="learn" style="flex:2">علّمني</button><button class="btn" id="know" style="flex:1">أعرفها</button></div></div>`;
  }else if(!s.res){
    body='<div class="panel">'+testBody(i)+'</div>';
  }else{
    body='<div class="panel">'+testBody(i,true)+feedback(i)+'</div>';
  }
  $('#app').innerHTML=head+body;wireSession(i)}

function hintHTML(i){
  const s=SESS,h=s.hint,p=[];
  const hasEx=/\{/.test(i.ex||'');
  const lvl=hasEx||s.kind==='dict'?[ 'def','letter','ar']:['letter','ar'];
  lvl.slice(0,h).forEach(k=>{
    if(k==='def')p.push(`<div class="def en blk" style="font-size:18px">${esc(i.def)}</div>`);
    if(k==='letter')p.push(`<div class="hint">أول حرف: <span class="en"><b>${esc(i.w[0])}</b></span> · عدد الحروف: ${i.w.length}</div>`);
    if(k==='ar')p.push(`<div class="hint">${esc(i.ar||'—')}</div>`)});
  const more=h<lvl.length;
  return p.join('')+(more?`<div><button class="link" type="button" id="hint">تلميح</button></div>`:'')}

function testBody(i,done){
  const s=SESS;let h='';
  if(s.kind==='choice'){
    h=`<div class="note">اختر الكلمة المناسبة</div><div class="def en blk">${esc(i.def)}</div>${exHTML(i,'blank')}
    <div class="opts">${s.opts.map(o=>{const w=info(o).w;let c='opt';
      if(done){if(o===s.cur.id)c+=' ok';else if(o===s.pick)c+=' bad'}
      return `<button class="${c}" data-o="${esc(o)}" ${done?'disabled':''}>${esc(w)}</button>`}).join('')}</div>`;
  }else if(s.kind==='cloze'){
    h=`<div class="note">اكتب الكلمة الناقصة</div>${/\{/.test(i.ex||'')?exHTML(i,done?'mark':'blank'):`<div class="def en blk">${esc(i.def)}</div>`}
    ${done?'':hintHTML(i)}
    <form id="f" autocomplete="off"><input class="ans" id="ans" type="text" ${done?'disabled value="'+esc(s.typed)+'"':''} autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" dir="ltr" aria-label="الإجابة">
    ${done?'':'<button class="btn pri blk" style="margin-top:12px">تأكيد</button>'}</form>`;
  }else{
    h=`<div class="note">اكتب اللي تسمعه</div><div class="row" style="margin:12px 0">${sayBtn(i.w,'sw')}<span class="note">اضغط للإعادة</span></div>
    ${done?'':hintHTML(i)}
    <form id="f" autocomplete="off"><input class="ans" id="ans" type="text" ${done?'disabled value="'+esc(s.typed)+'"':''} autocapitalize="off" autocomplete="off" autocorrect="off" spellcheck="false" dir="ltr" aria-label="الإجابة">
    ${done?'':'<button class="btn pri blk" style="margin-top:12px">تأكيد</button>'}</form>`}
  return h}

function feedback(i){
  const s=SESS,r=s.res;let cls=r==='ok'?'ok':r==='near'?'near':'bad';
  const msg=r==='ok'?'صح':r==='near'?`قريب، الإملاء الصحيح: ${i.w}`:`الجواب: ${i.w}`;
  const msgHTML=r==='ok'?'صح':r==='near'?`قريب، الإملاء الصحيح: <span class="en"><b>${esc(i.w)}</b></span>`:`الجواب: <span class="en"><b>${esc(i.w)}</b></span>`;
  return `<div class="fb ${cls}" role="status">${msgHTML}</div>
   <div class="def en blk" style="font-size:18px">${esc(i.def)}</div>${s.kind!=='cloze'?exHTML(i,'mark'):''}
   <div class="row" style="margin-top:8px">${sayBtn(i.w)}${i.ex?sayBtn(i.ex):''}<span class="note" style="margin-inline-start:auto">${esc(i.ar||'')}</span></div>
   <div class="row" style="margin-top:16px"><button class="btn pri" id="nx" style="flex:2" autofocus>التالي</button>
   ${r==='ok'&&s.rate!==R.Easy&&s.hint===0?'<button class="btn" id="easy" style="flex:1">سهلة جداً</button>':''}</div>`}

function wireSession(i){
  const s=SESS;
  document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>say(b.dataset.say));
  $('#quit').onclick=()=>finish();
  if(s.step==='intro'){
    $('#learn').onclick=()=>introduce(false);$('#know').onclick=()=>introduce(true);return}
  const h=$('#hint');if(h)h.onclick=()=>{s.hint++;const v=$('#ans')?$('#ans').value:'';render();const a=$('#ans');if(a){a.value=v;a.focus()}};
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(s.res)return;s.pick=b.dataset.o;s.res=s.pick===s.cur.id?'ok':'bad';commit()});
  const f=$('#f');if(f){f.onsubmit=e=>{e.preventDefault();if(s.res)return;const v=$('#ans').value.trim().toLowerCase();if(!v)return;
    s.typed=v;const w=i.w.toLowerCase(),fo=formOf(i).toLowerCase();
    const d=Math.min(lev(v,w),lev(v,fo));
    s.res=(v===w||v===fo)?'ok':(d===1&&w.length>=4)?'near':'bad';commit()};
    const a=$('#ans');if(a&&!s.res)setTimeout(()=>a.focus(),30)}
  const nx=$('#nx');if(nx){nx.onclick=()=>next();nx.focus()}
  const ez=$('#easy');if(ez)ez.onclick=()=>{rate(R.Easy);ez.remove()}}

function introduce(known){
  const s=SESS,id=s.cur.id;const now=new Date();
  S.st[id]={f:F.createEmptyCard(now)};if(!known)today().n++;save();
  if(known){const queued=new Set(s.Q.map(q=>q.id));const np=newPool().find(x=>x!==id&&!queued.has(x));if(np)s.Q.push({id:np,k:'new'})}
  s.cur={id,k:'rev',known};s.step='test';s.res=null;s.hint=0;s.t0=Date.now();s.applied=null;s.counted=false;
  if(!known){ // brief gap: show two other cards first so it isn't just copying
    const ins=Math.min(s.Q.length,2);s.Q.splice(ins,0,s.cur);return next()}
  prepTest();render();if(s.kind==='dict')say(info(id).w)}

function commit(){
  const s=SESS,id=s.cur.id;let r;
  if(s.res==='bad')r=R.Again;else if(s.res==='near')r=R.Hard;
  else if(s.kind==='choice')r=R.Good;
  else if(s.hint>0)r=R.Hard;
  else r=s.cur.known?R.Easy:R.Good;
  s.rate=r;rate(r);render();
  if(s.res==='ok'||s.res==='near'){say(info(id).w)}}

function rate(r){
  const s=SESS,id=s.cur.id;
  if(s.applied){ // re-rating (Easy override): recompute from the stored pre-card
    S.st[id].f=s.applied.pre;if(s.held)s.held=s.held.filter(x=>x.id!==id)}
  const pre=S.st[id].f;const now=new Date();
  const out=sched.next(cardOf(id),now,r);
  S.st[id].f=out.card;s.applied={pre};s.rate=r;
  const k=dayKey(now);S.log[k]=S.log[k]||{r:0,ok:0};
  if(!s.counted){S.log[k].r++;if(s.res==='ok'||s.res==='near'){S.log[k].ok++;s.ok++}else s.bad.push(id);s.n++;s.counted=true;
    if(new Date(out.card.due)-now<20*60e3){s.held=s.held||[];const item={id,k:'rev'};
      if(r===R.Again&&s.Q.length>=3)s.Q.splice(3,0,item);else s.held.push(item)}}
  save()}


function finish(){
  const s=SESS;SESS=null;const al=Math.min(allowance(),newPool().length);
  $('#app').innerHTML=`<h1>تمام</h1><p class="sub">${s.n} بطاقة · ${s.n?Math.round(s.ok/s.n*100):0}٪ صح</p>
   <div class="panel">${s.bad.length?`<div class="note">كلمات تحتاج وقت</div><div class="chips">${[...new Set(s.bad)].map(id=>`<span class="chip">${esc(info(id).w)}</span>`).join('')}</div>`:'<div>ما غلطت ولا بطاقة.</div>'}
   <button class="btn pri blk" id="h" style="margin-top:16px">الرئيسية</button>
   ${al?`<button class="btn blk" id="again" style="margin-top:10px">كمّل</button>`:''}</div>
   <p class="note" style="margin-top:16px">الكلمات اللي غلطت فيها ترجع لك اليوم بجلسة قادمة، والباقي يتجدول لأيام لاحقة تلقائياً.</p>`;
  $('#h').onclick=()=>go('home');const a=$('#again');if(a)a.onclick=startSession}

/* ---------- add text ---------- */
let TX={text:'',res:null};
function lemma(t){
  if(RANK[t])return t;
  const c=[];
  if(t.endsWith('ies'))c.push(t.slice(0,-3)+'y');
  if(t.endsWith('es'))c.push(t.slice(0,-2));
  if(t.endsWith('s'))c.push(t.slice(0,-1));
  if(t.endsWith('ied'))c.push(t.slice(0,-3)+'y');
  if(t.endsWith('ed')){c.push(t.slice(0,-2));c.push(t.slice(0,-1));if(/(.)\1ed$/.test(t))c.push(t.slice(0,-3))}
  if(t.endsWith('ing')){c.push(t.slice(0,-3));c.push(t.slice(0,-3)+'e');if(/(.)\1ing$/.test(t))c.push(t.slice(0,-4))}
  if(t.endsWith('ly'))c.push(t.slice(0,-2));
  if(t.endsWith('er'))c.push(t.slice(0,-2));
  for(const x of c){if(RANK[x]||BASE[x]||S.custom[x])return x}
  return t}
function analyze(text){
  const toks=text.match(/[A-Za-z][A-Za-z'’-]*/g)||[];const m={};
  const sents=text.split(/(?<=[.!?…])\s+|\n+/).filter(Boolean);
  toks.forEach(raw=>{
    const w=raw.replace(/['’]s$/i,'').replace(/^[-']+|[-']+$/g,'');if(w.length<3||/'/.test(w))return;
    const low=w.toLowerCase();const lm=lemma(low);
    const o=m[lm]||(m[lm]={lm,n:0,forms:{},cap:0});o.n++;o.forms[low]=(o.forms[low]||0)+1;if(/^[A-Z]/.test(w))o.cap++});
  const rows=Object.values(m).filter(o=>{
    if(o.cap===o.n&&o.n>=1&&!BASE[o.lm]&&!RANK[o.lm])return false; // likely a name
    return true});
  rows.forEach(o=>{o.rank=RANK[o.lm]||99999;});
  rows.forEach(o=>{ // sentence containing the commonest form
    const f=Object.keys(o.forms).sort((a,b)=>o.forms[b]-o.forms[a])[0];o.form=f;
    const re=new RegExp('\\b'+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i');
    const se=sents.find(x=>re.test(x));o.sent=se?se.trim().replace(/\s+/g,' '):''});
  return rows}
function viewText(){
  const skip=S.set.skipTop;
  let list='';
  if(TX.res){
    TX.res.forEach(o=>{o.have=!!(S.st[o.lm]||S.custom[o.lm])});const rows=TX.res.filter(o=>o.rank>skip).sort((a,b)=>b.n-a.n||a.rank-b.rank);
    list=`<h2>${rows.length} كلمة</h2><p class="note">مرتبة حسب تكرارها في النصّ ثم شيوعها في الإنجليزية. اضغط الكلمة لإضافتها. الكلمات الشائعة جداً (أول ${skip}) مخفية.</p>
    <div class="chips">${rows.slice(0,120).map(o=>`<button class="chip ${o.have?'on':''}" data-lm="${esc(o.lm)}">${esc(o.lm)}<small>${o.n>1?'×'+o.n+' · ':''}${o.rank>6500?'نادرة':o.rank>2500?'متوسطة':'شائعة'}</small></button>`).join('')}</div>`}
  $('#app').innerHTML=`<h1>أضف نص</h1><p class="sub">الصق حوار Genshin أو فصل من رواية، وأطلع لك الكلمات اللي تستاهل.</p>
  <textarea id="tx" placeholder="Paste English text here" dir="ltr">${esc(TX.text)}</textarea>
  <div class="row" style="margin-top:10px"><button class="btn pri" id="an" style="flex:1">حلّل</button><button class="btn" id="clr">مسح</button></div>${list}`;
  $('#an').onclick=()=>{TX.text=$('#tx').value;TX.res=analyze(TX.text);viewText()};
  $('#clr').onclick=()=>{TX={text:'',res:null};viewText()};
  document.querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>openAdd(b.dataset.lm))}

async function fetchDef(w){
  try{const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(w));if(!r.ok)return null;
    const j=await r.json();const m=j[0].meanings[0];return{pos:m.partOfSpeech,def:m.definitions[0].definition}}catch(e){return null}}
async function openAdd(lm){
  const o=TX.res.find(x=>x.lm===lm);if(!o)return;
  const exist=S.st[lm];
  const ex=o.sent?o.sent.replace(new RegExp('\\b('+o.form.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')\\b','i'),'{$1}'):'';
  const b=BASE[lm];
  const sh=document.createElement('div');sh.className='sheet';
  sh.innerHTML=`<div><div class="hd"><div class="word en" style="font-size:36px">${esc(lm)}</div>${sayBtn(lm)}</div>
   ${o.sent?`<span class="en blk exs" style="font-size:16px">${esc(o.sent)}</span>`:''}
   <label class="f" for="d">التعريف (بالإنجليزي)</label><input type="text" id="d" dir="ltr" value="${b?esc(b.def):''}" placeholder="${b?'':'جاري البحث…'}">
   <label class="f" for="a">بالعربي (اختياري)</label><input type="text" id="a" value="${b?esc(b.ar):''}">
   <p class="note" id="nt"></p>
   <div class="row" style="margin-top:12px"><button class="btn pri" id="ad" style="flex:2" ${exist?'disabled':''}>${exist?'موجودة عندك':'أضف'}</button><button class="btn" id="cl" style="flex:1">إلغاء</button></div></div>`;
  document.body.appendChild(sh);
  sh.querySelector('[data-say]').onclick=()=>say(lm);
  sh.querySelector('#cl').onclick=()=>sh.remove();
  sh.onclick=e=>{if(e.target===sh)sh.remove()};
  let pos=b?b.pos:'';
  if(!b){const r=await fetchDef(lm);const d=sh.querySelector('#d');
    if(r){if(!d.value)d.value=r.def;pos=r.pos;sh.querySelector('#nt').textContent='التعريف من قاموس مفتوح، عدّله إذا كان صعب.'}
    else{d.placeholder='اكتب تعريف بسيط بالإنجليزي';sh.querySelector('#nt').textContent='ما قدرت أجيب التعريف، اكتبه بنفسك.'}}
  sh.querySelector('#ad').onclick=()=>{
    const def=sh.querySelector('#d').value.trim();if(!def){sh.querySelector('#nt').textContent='لازم تعريف.';return}
    S.custom[lm]={w:lm,pos:pos||'',def,ex:ex||(b?b.ex:''),ar:sh.querySelector('#a').value.trim()};
    save();sh.remove();viewText()}}

/* ---------- words ---------- */
let WQ='';
function viewWords(){
  const ids=Object.keys(S.st);
  const rows=ids.filter(id=>!WQ||id.includes(WQ.toLowerCase())).sort((a,b)=>new Date(S.st[a].f.due)-new Date(S.st[b].f.due));
  const stName=s=>['جديدة','تتعلم','تُراجع','إعادة تعلم'][s];
  const when=d=>{d=new Date(d);const m=(d-new Date())/6e4;if(m<=0)return'الحين';if(m<60)return Math.round(m)+' د';if(m<1440)return Math.round(m/60)+' س';return Math.round(m/1440)+' يوم'};
  $('#app').innerHTML=`<h1>كلماتي</h1><p class="sub">${ids.length} كلمة في التدريب · ${newPool().length} باقية بالمجموعة</p>
  <input type="search" id="q" placeholder="ابحث" dir="ltr" value="${esc(WQ)}" aria-label="بحث">
  <div class="list panel" style="margin-top:14px;padding:6px 16px">${rows.length?rows.slice(0,200).map(id=>{const i=info(id),c=S.st[id].f;
    return `<div class="it"><div><span class="en" style="font-weight:600;font-size:19px">${esc(i.w)}</span><div class="tag">${stName(c.state)} · قادمة بعد ${when(c.due)}</div></div><button class="link" data-del="${esc(id)}">حذف</button></div>`}).join(''):'<p class="note" style="padding:10px 0">ما في كلمات بعد. ابدأ من «اليوم».</p>'}</div>`;
  const q=$('#q');q.oninput=()=>{WQ=q.value;const p=q.selectionStart;viewWords();const n=$('#q');n.focus();n.setSelectionRange(p,p)};
  document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('حذف «'+b.dataset.del+'» من التدريب؟')){delete S.st[b.dataset.del];save();viewWords()}})}

/* ---------- settings ---------- */
function viewSet(){
  $('#app').innerHTML=`<h1>الإعدادات</h1><p class="sub"></p>
  <label class="f" for="pd">كلمات جديدة في اليوم: <b id="pdv">${S.set.perDay}</b></label>
  <input type="range" id="pd" min="3" max="30" value="${S.set.perDay}" style="width:100%">
  <label class="f" for="sk">إخفاء أشيع كلمات الإنجليزية في تحليل النص: <b id="skv">${S.set.skipTop}</b></label>
  <input type="range" id="sk" min="0" max="3000" step="100" value="${S.set.skipTop}" style="width:100%">
  <label class="f" for="rt">سرعة النطق: <b id="rtv">${S.set.rate}</b></label>
  <input type="range" id="rt" min="0.6" max="1.1" step="0.05" value="${S.set.rate}" style="width:100%">
  <label class="f"><input type="checkbox" id="dc" ${S.set.dict?'checked':''}> تمارين الإملاء بالصوت ${canSay()?'':'(جهازك ما يدعم الصوت)'}</label>
  <h2>نسخة احتياطية</h2>
  <p class="note">تقدمك محفوظ في هذا المتصفح فقط. نزّل نسخة من وقت لوقت، خاصة قبل ما تمسح بيانات المتصفح.</p>
  <div class="row"><button class="btn" id="ex">تنزيل نسخة</button><button class="btn" id="im">استرجاع نسخة</button><input type="file" id="fi" accept="application/json" hidden></div>
  <p class="note" id="msg"></p>
  <h2>أصل الكلمات</h2>
  <p class="note">المجموعة: ${BASE_IDS.length} كلمة مرتبة من الأشيع للأقل، مع تعريفات بإنجليزي مبسّط وجمل وتلميحات عربية كتبها Claude (مراجعتها من عندك تفيد). فيها كمان كلمات شائعة في القصص والأنمي. ترتيب الأشيع لتحليل النصوص مأخوذ من مكتبة wordfreq (بيانات CC BY-SA 4.0). الجدولة: مكتبة ts-fsrs (MIT).</p>
  <button class="btn" id="rs" style="margin-top:14px;color:var(--bad)">مسح كل شي</button>`;
  const bind=(id,k,f)=>{const e=$('#'+id);e.oninput=()=>{S.set[k]=f(e.value);$('#'+id+'v').textContent=S.set[k];save()}};
  bind('pd','perDay',Number);bind('sk','skipTop',Number);bind('rt','rate',Number);
  $('#dc').onchange=e=>{S.set.dict=e.target.checked;save()};
  $('#ex').onclick=()=>{const b=new Blob([JSON.stringify(S)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='kalimati-'+dayKey()+'.json';a.click()};
  $('#im').onclick=()=>$('#fi').click();
  $('#fi').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const j=JSON.parse(r.result);if(j.v!==1||!j.st)throw 0;S=j;save();$('#msg').textContent='تم الاسترجاع.'}catch(x){$('#msg').textContent='الملف مو صحيح.'}};r.readAsText(f)};
  $('#rs').onclick=()=>{if(confirm('تمسح كل تقدمك؟')){S=fresh();save();go('home')}}}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>go(b.dataset.t));
render();
</script>
